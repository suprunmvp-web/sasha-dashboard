<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>SashaAI · Аналитика продаж</title>
<style>
[data-theme="dark"]{
  --bg:#0B0E14;--surface:#11151F;--surface-2:#161B27;--surface-3:#1C2230;
  --border:#232a3a;--border-soft:#1a2030;
  --text:#E8ECF4;--text-2:#9AA4B8;--text-3:#5E6781;
  --accent:#4D7CFE;--accent-bg:rgba(77,124,254,.12);
  --green:#2ED3A7;--amber:#F5B544;--red:#FB6E5B;
  --green-bg:rgba(46,211,167,.12);--amber-bg:rgba(245,181,68,.12);--red-bg:rgba(251,110,91,.12);
  --shadow:0 24px 64px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#F0F2F7;--surface-3:#E6E9F0;
  --border:#DCE1EB;--border-soft:#E8ECF3;
  --text:#1A1F2E;--text-2:#5A6478;--text-3:#98A1B3;
  --accent:#3D6BF5;--accent-bg:rgba(61,107,245,.10);
  --green:#16A97F;--amber:#D89318;--red:#E25540;
  --green-bg:rgba(22,169,127,.12);--amber-bg:rgba(216,147,24,.12);--red-bg:rgba(226,85,64,.12);
  --shadow:0 16px 48px rgba(30,40,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:1.5rem;-webkit-font-smoothing:antialiased;}
.app{max-width:1040px;margin:0 auto;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.pos{color:var(--green);}.neg{color:var(--red);}.neu{color:var(--text-2);}

/* ROLEBAR */
.rolebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:12px;flex-wrap:wrap;}
.role-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:11px;padding:3px;}
.role-btn{font-size:12px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;}
.role-btn.on{background:var(--accent);color:#fff;}
.role-btn:not(.on):hover{color:var(--text);}
.role-meta{font-size:11px;color:var(--text-3);}
.bar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn{font-size:12px;padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:10px;}
.back-btn{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);}
.brand{font-size:18px;font-weight:600;letter-spacing:-.01em;}
.brand .accent{color:var(--accent);}
.crumb-title{font-size:18px;font-weight:600;}

/* CALENDAR */
.cal-trigger{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text);}
.cal-trigger svg{opacity:.6;}
.cal-pop{position:absolute;right:0;top:48px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;z-index:50;box-shadow:var(--shadow);display:none;}
.cal-pop.open{display:block;}
.cal-wrap{position:relative;}
.cal-presets{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.cal-preset{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;}
.cal-months{display:flex;gap:28px;}
.cal-mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-mtitle{font-size:13px;font-weight:600;}
.cal-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,30px);gap:2px;}
.cal-dow{font-size:10px;color:var(--text-3);text-align:center;height:24px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;}
.cal-day{font-size:12px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:var(--text);}
.cal-day:hover{background:var(--surface-3);}
.cal-day.other{color:var(--text-3);}
.cal-day.in-range{background:var(--accent-bg);border-radius:0;}
.cal-day.range-start{background:var(--accent);color:#fff;border-radius:8px 0 0 8px;}
.cal-day.range-end{background:var(--accent);color:#fff;border-radius:0 8px 8px 0;}
.cal-day.range-single{background:var(--accent);color:#fff;border-radius:8px;}

/* KPI CARDS */
.ckpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.ck{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;}
.ck-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:500;}
.ck-v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.ck-s{font-size:12px;margin-top:8px;color:var(--text-2);}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dept-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;}
.dept-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.dc-name{font-size:16px;font-weight:600;}
.dc-meta{font-size:11px;color:var(--text-3);margin-top:4px;}
.dc-badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600;}
.bg{background:var(--green-bg);color:var(--green);}.ba{background:var(--amber-bg);color:var(--amber);}.br{background:var(--red-bg);color:var(--red);}
.dc-fact{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
.dc-plan{font-size:12px;color:var(--text-3);margin-bottom:14px;}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;border-radius:6px;transition:width .5s;}
.dc-stats{display:flex;justify-content:space-between;}
.dc-stat-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.dc-stat-v{font-size:15px;font-weight:600;margin-top:2px;}
.dept-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem;}
.kcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;}
.kl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:500;}
.kv{font-size:20px;font-weight:600;line-height:1;}
.ks{font-size:11px;margin-top:6px;}
.pbar{height:3px;background:var(--surface-3);border-radius:2px;margin-top:9px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;}

/* TABS / PANELS */
.tab-row{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:4px;width:fit-content;}
.tab{font-size:13px;padding:8px 18px;border-radius:9px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;}
.tab.on{background:var(--accent);color:#fff;}
.tab:not(.on):hover{color:var(--text);}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
.panel-title{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:16px;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:var(--text-3);padding:0 12px 12px 0;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;}
.tbl th:hover{color:var(--text-2);}
.tbl th .sort{opacity:.4;font-size:9px;margin-left:2px;}
.tbl th.sorted{color:var(--accent);}.tbl th.sorted .sort{opacity:1;}
.tbl th.r,.tbl td.r{text-align:right;}
.tbl td{padding:11px 12px 11px 0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface-2);}
.tbl .muted{color:var(--text-2);}.tbl .strong{font-weight:600;}
.inbar{height:4px;width:60px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-left:auto;margin-top:5px;}
.inbar-f{height:100%;border-radius:2px;}

/* MULTI-SELECT */
.ms-wrap{position:relative;margin-bottom:12px;}
.ms-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:30px;padding:7px 10px;min-height:44px;cursor:text;}
.ms-add{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-add:hover{border-color:var(--accent);color:var(--accent);}
.ms-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px 5px 11px;border-radius:20px;background:var(--accent-bg);border:1px solid var(--border);}
.ms-chip .x{cursor:pointer;opacity:.6;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ms-chip .x:hover{opacity:1;}
.ms-hint{font-size:13px;color:var(--text-3);padding-left:4px;}
.ms-drop{position:absolute;left:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;z-index:40;box-shadow:var(--shadow);min-width:260px;display:none;max-height:320px;overflow-y:auto;}
.ms-drop.open{display:block;}
.ms-sect{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 6px;font-weight:600;}
.ms-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
.ms-opt:hover{background:var(--surface-3);}
.ms-opt .check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.ms-opt.sel .check{background:var(--accent);border-color:var(--accent);color:#fff;}

/* MISC */
.ext-link{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:600;}
.ext-link:hover{color:var(--accent);}
.lk{font-size:10px;opacity:.5;}
.days-badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;display:inline-block;}
.db-red{background:var(--red-bg);color:var(--red);}.db-amb{background:var(--amber-bg);color:var(--amber);}
.db-grn{background:var(--green-bg);color:var(--green);}.db-neu{background:var(--surface-3);color:var(--text-2);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;line-height:1.7;}

/* ADMIN */
.adm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn{font-size:12px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:500;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-sm{font-size:11px;padding:5px 10px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:500;}
.field input,.field select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.inline-input{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:13px;width:110px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums;}
.inline-input:focus{outline:none;border-color:var(--accent);}
.role-select{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;color:var(--text);font-size:11px;font-family:inherit;cursor:pointer;}
.role-select:focus{outline:none;border-color:var(--accent);}
.role-select.lead{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
.status-dot .d{width:7px;height:7px;border-radius:50%;}
.dept-edit-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;width:440px;max-width:92vw;box-shadow:var(--shadow);}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.save-hint{font-size:11px;color:var(--green);margin-left:8px;opacity:0;transition:opacity .3s;}
.save-hint.show{opacity:1;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--text-3);}
.spinner{width:38px;height:38px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-banner{background:var(--red-bg);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:13px;color:var(--red);}
.toggle-wrap{display:flex;align-items:center;gap:12px;}
.toggle{width:42px;height:24px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--accent);border-color:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.toggle.on .knob{left:21px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-bg" id="modal"></div>
<script>
/* ═══ SUPABASE ═══ */
var SB_URL='https://qhpyrlhugpqgojwmarrw.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFocHlybGh1Z3BxZ29qd21hcnJ3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDY1Mjg5MCwiZXhwIjoyMDk2MjI4ODkwfQ.J1KvnwrxAbfEINT4ntxz_nWQJx7ZNgD4iPC2pPdGIV4';
function sbGet(p){return fetch(SB_URL+'/rest/v1/'+p,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).then(function(d){if(d&&d.code){console.error('SB error',p,d.message);return[];}return Array.isArray(d)?d:[];}).catch(function(e){console.error(e);return[];});}
function sbPatch(t,f,d){return fetch(SB_URL+'/rest/v1/'+t+'?'+f,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(d)}).then(function(r){return r.status;});}
function sbPost(t,d){return fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(d)}).then(function(r){return r.json();});}

/* ═══ STATE ═══ */
var TODAY=new Date();
var MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var DOW=['пн','вт','ср','чт','пт','сб','вс'];
var DB=null,RAW={depts:[],employees:[],clients:[]};
var S={role:'cd',theme:'dark',loading:true,loadErr:null,
  rangeFrom:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),
  rangeTo:new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0),
  calLeft:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),calOpen:false,pick:0,
  dept:null,tab:'staff',clientMgrs:[],mgrDropOpen:false,
  cliSortKey:'minLeft',cliSortDir:1,staffSortKey:'fact',staffSortDir:-1,
  ropDept:null,mgrAs:null,saveHint:false,factMode:'manual'};

/* ═══ UTILS ═══ */
function r(n){return Math.round(n||0);}
function fmt(n){n=n||0;if(n>=1e6)return(n/1e6).toFixed(1)+' млн';if(n>=1e3)return r(n/1e3)+'к';return String(r(n));}
function pct(f,p){return p>0?r(f/p*100):0;}
function grad(p){p=Math.max(0,Math.min(100,p))/100;var s=[[251,110,91],[245,181,68],[46,211,167]];var g=p<.5?0:1,t=p<.5?p/.5:(p-.5)/.5,a=s[g],b=s[g+1];return'rgb('+r(a[0]+(b[0]-a[0])*t)+','+r(a[1]+(b[1]-a[1])*t)+','+r(a[2]+(b[2]-a[2])*t)+')';}
function daysTo(ds){if(!ds)return null;return Math.max(0,r((new Date(ds)-TODAY)/86400e3));}
function fmtD(ds){if(!ds)return'—';var p=ds.substring(0,10).split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function rr(fact,plan){var f=S.rangeFrom,t=S.rangeTo,el=Math.max(1,r((Math.min(TODAY,t)-f)/864e5)+1),tot=Math.max(1,r((t-f)/864e5)+1);var ex=plan*(el/tot);return ex>0?r(fact/ex*100):0;}
function calLabel(){var f=S.rangeFrom,t=S.rangeTo;return MN[f.getMonth()]+' '+String(f.getDate()).padStart(2,'0')+', '+f.getFullYear()+' — '+MN[t.getMonth()]+' '+String(t.getDate()).padStart(2,'0')+', '+t.getFullYear();}
function daysBadge(dn){if(dn===null)return'<span class="days-badge db-neu">—</span>';if(dn<=3)return'<span class="days-badge db-red">'+dn+'д</span>';if(dn<=7)return'<span class="days-badge db-amb">'+dn+'д</span>';if(dn<=14)return'<span class="days-badge db-neu">'+dn+'д</span>';return'<span class="days-badge db-grn">'+dn+'д</span>';}
function si(a,d){return a?'<span class="sort">'+(d>0?'▲':'▼')+'</span>':'<span class="sort">↕</span>';}

/* ═══ DATA ═══ */
function loadData(){
  S.loading=true;S.loadErr=null;render();
  return Promise.all([
    sbGet('departments?select=*&order=created_at'),
    sbGet('employees?select=*&status=eq.active&order=name'),
    sbGet('clients?select=platform_org_id,company_name,platform_url,responsible_platform_user_id,minutes_total,minutes_left,monthly_plan,monthly_fact,subscription_status,subscription_name,subscription_end&is_archived=eq.false&responsible_platform_user_id=not.is.null&order=company_name&limit=3000')
  ]).then(function(res){
    RAW.depts=res[0];RAW.employees=res[1];RAW.clients=res[2];
    if(!RAW.depts.length&&!RAW.employees.length)
      S.loadErr='Supabase вернул пустые данные. Выполни master.sql и нажми Cmd+Shift+R.';
    buildDB();S.loading=false;
    if(!S.ropDept&&DB.depts.length)S.ropDept=DB.depts[0].id;
    if(!S.mgrAs){DB.depts.forEach(function(d){if(!S.mgrAs&&d.staff.length)S.mgrAs=d.staff[0].id;});}
    render();
  }).catch(function(e){S.loading=false;S.loadErr=e.message;render();});
}

function buildDB(){
  var eBP={},eBD={},cBU={};
  RAW.employees.forEach(function(e){if(e.platform_user_id)eBP[e.platform_user_id]=e;});
  RAW.employees.forEach(function(e){if(e.dept_id)(eBD[e.dept_id]=eBD[e.dept_id]||[]).push(e);});
  RAW.clients.forEach(function(c){var u=c.responsible_platform_user_id;if(u)(cBU[u]=cBU[u]||[]).push(c);});

  var depts=RAW.depts.map(function(d){
    var emps=eBD[d.id]||[];
    var lead=RAW.employees.find(function(e){return e.id===d.lead_employee_id;});
    var staff=emps.map(function(e){
      var ec=cBU[e.platform_user_id]||[];
      return{id:e.platform_user_id,supaId:e.id,name:e.name,
        role:e.role==='lead'?'Тимлид':'Менеджер',hired:e.hired_at||'2025-01-01',
        fact:ec.reduce(function(a,c){return a+(c.monthly_fact||0);},0),
        plan:ec.reduce(function(a,c){return a+(c.monthly_plan||0);},0),
        clients:ec.length};
    });
    staff.sort(function(a,b){return(b.role==='Тимлид')-(a.role==='Тимлид');});
    var dc=emps.reduce(function(a,e){return a.concat(cBU[e.platform_user_id]||[]);},[]);
    var dFact=staff.reduce(function(a,m){return a+m.fact;},0);
    var dPlan=staff.reduce(function(a,m){return a+m.plan;},0);
    return{id:d.id,name:d.name,tl:lead?lead.name:'—',leadId:d.lead_employee_id,
      fact:dFact,plan:dPlan,paying:dc.filter(function(c){return c.subscription_status==='active';}).length,
      arpu:dc.length?r(dFact/dc.length):0,staff:staff,former:[],
      clients:dc.map(function(c){return{platform_org_id:c.platform_org_id,
        name:(c.company_name||'').substring(0,45),mgr:c.responsible_platform_user_id,
        url:c.platform_url||'#',plan:c.monthly_plan||0,fact:c.monthly_fact||0,
        minSpent:Math.max(0,(c.minutes_total||0)-(c.minutes_left||0)),
        minLeft:c.minutes_left||0,expiry:c.subscription_end||null};})};
  });

  DB={company:{fact:depts.reduce(function(a,d){return a+d.fact;},0),
    plan:depts.reduce(function(a,d){return a+d.plan;},0),
    clients:depts.reduce(function(a,d){return a+d.clients.length;},0),
    paying:depts.reduce(function(a,d){return a+d.paying;},0)},depts:depts};
}

/* ═══ CALENDAR ═══ */
function buildMonth(base){var y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),sd=(first.getDay()+6)%7,days=[];for(var i=0;i<sd;i++)days.push({d:new Date(y,m,1-(sd-i)),other:true});var dim=new Date(y,m+1,0).getDate();for(var k=1;k<=dim;k++)days.push({d:new Date(y,m,k),other:false});while(days.length%7){var l=days[days.length-1].d;days.push({d:new Date(l.getFullYear(),l.getMonth(),l.getDate()+1),other:true});}return days;}
function renderCalMonth(base){var days=buildMonth(base);var cells=DOW.map(function(d){return'<div class="cal-dow">'+d+'</div>';}).join('');days.forEach(function(o){var cls='cal-day'+(o.other?' other':'');var t=o.d.getTime(),f=S.rangeFrom.getTime(),tt=S.rangeTo.getTime();if(sameDay(o.d,S.rangeFrom)&&sameDay(o.d,S.rangeTo))cls+=' range-single';else if(sameDay(o.d,S.rangeFrom))cls+=' range-start';else if(sameDay(o.d,S.rangeTo))cls+=' range-end';else if(t>f&&t<tt)cls+=' in-range';cells+='<div class="'+cls+'" onclick="pickDay('+o.d.getFullYear()+','+o.d.getMonth()+','+o.d.getDate()+')">'+o.d.getDate()+'</div>';});return'<div class="cal-grid">'+cells+'</div>';}
function renderCal(){var L=S.calLeft,R=new Date(L.getFullYear(),L.getMonth()+1,1);var ph=['7 дней','30 дней','Этот месяц','Квартал'].map(function(p,i){return'<button class="cal-preset" onclick="applyPreset('+i+')">'+p+'</button>';}).join('');return'<div class="cal-presets">'+ph+'</div><div class="cal-months"><div><div class="cal-mhead"><button class="cal-nav" onclick="calShift(-1)">‹</button><span class="cal-mtitle">'+MN[L.getMonth()]+' '+L.getFullYear()+'</span><span style="width:28px"></span></div>'+renderCalMonth(L)+'</div><div><div class="cal-mhead"><span style="width:28px"></span><span class="cal-mtitle">'+MN[R.getMonth()]+' '+R.getFullYear()+'</span><button class="cal-nav" onclick="calShift(1)">›</button></div>'+renderCalMonth(R)+'</div></div>';}
window.calShift=function(d){S.calLeft=new Date(S.calLeft.getFullYear(),S.calLeft.getMonth()+d,1);render();};
window.pickDay=function(y,m,d){var p=new Date(y,m,d);if(S.pick===0){S.rangeFrom=p;S.rangeTo=p;S.pick=1;}else{if(p<S.rangeFrom){S.rangeTo=S.rangeFrom;S.rangeFrom=p;}else S.rangeTo=p;S.pick=0;}render();};
window.applyPreset=function(i){var p=[{days:7},{days:30},{tm:1},{days:90}][i];if(p.tm){S.rangeFrom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);S.rangeTo=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0);}else{S.rangeTo=new Date(TODAY);S.rangeFrom=new Date(TODAY.getTime()-(p.days-1)*864e5);}S.calLeft=new Date(S.rangeFrom.getFullYear(),S.rangeFrom.getMonth(),1);S.pick=0;render();};
window.toggleCal=function(e){e.stopPropagation();S.calOpen=!S.calOpen;render();};

        '<select style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setRopDept(this.value)">'+deptOpts+'</select>'+
      '</div></div>'+
      '<table class="tbl"><thead><tr><th>Имя</th><th>Роль</th><th>Нанят</th><th>Статус</th><th class="r">Клиентов</th><th class="r">Действие</th></tr></thead><tbody>'+staffRows+'</tbody></table>'+
    '</div>'+
    unaBlock+
    '<div class="panel"><div class="adm-head"><div class="panel-title" style="margin:0">Все отделы</div><button class="btn btn-primary" onclick="createDept()">+ Создать отдел</button></div>'+deptCards+'</div>'
  );
}
window.setRopDept=function(id){S.ropDept=id;render();};
window.toggleFM=function(){S.factMode=S.factMode==='manual'?'api':'manual';render();};

/* смена роли инлайн */
window.changeEmpRole=function(supaId,role){
  sbPatch('employees','id=eq.'+supaId,{role:role});
  RAW.employees.forEach(function(e){if(e.id===supaId)e.role=role;});
  buildDB();render();
};

window.reassignEmp=function(supaId){
  var emp=RAW.employees.find(function(e){return e.id===supaId;});
  var opts='<option value="">— убрать из всех отделов —</option>'+DB.depts.map(function(x){return'<option value="'+x.id+'"'+(emp&&emp.dept_id===x.id?' selected':'')+'>'+x.name+'</option>';}).join('');
  openModal('Назначить в отдел',
    '<p style="font-size:13px;color:var(--text-2);margin-bottom:14px">'+(emp?emp.name:'')+'</p>'+
    '<div class="field"><label>Отдел</label><select id="re-dept">'+opts+'</select></div>',
    function(){var dept=document.getElementById('re-dept').value||null;assignDept(supaId,dept);closeModal();render();});
};

window.editDept=function(id){
  var x=DB.depts.find(function(z){return z.id===id;});
  /* только тимлиды в списке */
  var leads=RAW.employees.filter(function(e){return e.role==='lead';});
  var leadOpts='<option value="">— без тимлида —</option>'+leads.map(function(e){return'<option value="'+e.id+'"'+(x.leadId===e.id?' selected':'')+'>'+e.name+'</option>';}).join('');
  openModal('Настройка отдела',
    '<div class="field"><label>Название</label><input id="d-name" value="'+x.name+'"></div>'+
    '<div class="field"><label>Тимлид (только сотрудники с ролью Тимлид)</label><select id="d-lead">'+leadOpts+'</select></div>',
    function(){var nm=document.getElementById('d-name').value.trim()||x.name;var lead=document.getElementById('d-lead').value||null;
      sbPatch('departments','id=eq.'+id,{name:nm,lead_employee_id:lead});
      RAW.depts.forEach(function(dd){if(dd.id===id){dd.name=nm;dd.lead_employee_id=lead;}});
      if(lead){sbPatch('employees','id=eq.'+lead,{dept_id:id,role:'lead'});RAW.employees.forEach(function(e){if(e.id===lead){e.dept_id=id;e.role='lead';}});}
      buildDB();closeModal();render();});
};

window.createDept=function(){
  /* только тимлиды */
  var leads=RAW.employees.filter(function(e){return e.role==='lead';});
  var leadOpts='<option value="">— без тимлида —</option>'+leads.map(function(e){return'<option value="'+e.id+'">'+e.name+'</option>';}).join('');
  var noLeadHint=leads.length?'':'<div style="font-size:11px;color:var(--amber);margin-top:6px">Нет тимлидов. Сначала назначь роль «Тимлид» нужному сотруднику в списке отдела.</div>';
  openModal('Новый отдел',
    '<div class="field"><label>Название отдела</label><input id="nd-name" placeholder="Отдел Иванцова"></div>'+
    '<div class="field"><label>Тимлид</label><select id="nd-lead">'+leadOpts+'</select>'+noLeadHint+'</div>',
    function(){var nm=document.getElementById('nd-name').value.trim();if(!nm)return;var lead=document.getElementById('nd-lead').value||null;
      sbPost('departments',{name:nm,lead_employee_id:lead,monthly_plan:0}).then(function(res){
        var nd=Array.isArray(res)?res[0]:res;if(!nd||!nd.id)return;
        RAW.depts.push(nd);
        if(lead){sbPatch('employees','id=eq.'+lead,{dept_id:nd.id,role:'lead'});RAW.employees.forEach(function(e){if(e.id===lead){e.dept_id=nd.id;e.role='lead';}});}
        buildDB();closeModal();S.ropDept=nd.id;render();
      });
    });
};

/* ═══ МЕНЕДЖЕР ═══ */
function renderMgr(){
  var allMgrs=[];DB.depts.forEach(function(dd){dd.staff.forEach(function(m){allMgrs.push({id:m.id,name:m.name,dept:dd.name});});});
  if(!allMgrs.length){setApp('<div class="topbar"><div class="nav-left"><span class="brand">Кабинет менеджера</span></div></div><div class="empty-state">Нет менеджеров.<br>Зайди в <b>РОП</b> и назначь людей в отделы.</div>');return;}
  if(!S.mgrAs||!allMgrs.find(function(m){return m.id===S.mgrAs;}))S.mgrAs=allMgrs[0].id;
  var d=DB.depts.find(function(x){return x.staff.some(function(m){return m.id===S.mgrAs;});});
  if(!d){S.mgrAs=allMgrs[0].id;d=DB.depts.find(function(x){return x.staff.some(function(m){return m.id===S.mgrAs;});});}
  var myClients=d?d.clients.filter(function(c){return c.mgr===S.mgrAs;}):[];
  var asSel='<select style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setMgrAs(this.value)">'+allMgrs.map(function(m){return'<option value="'+m.id+'"'+(m.id===S.mgrAs?' selected':'')+'>'+m.name+'</option>';}).join('')+'</select>';

  var totalPlan=myClients.reduce(function(a,c){return a+c.plan;},0);
  var totalFact=myClients.reduce(function(a,c){return a+c.fact;},0);
  var mp=pct(totalFact,totalPlan),api=S.factMode==='api';
  var kH=['<div class="kcard"><div class="kl">Мой план</div><div class="kv num">'+fmt(totalPlan)+'</div><div class="ks"><span class="neu">факт '+fmt(totalFact)+' · '+mp+'%</span></div><div class="pbar"><div class="pfill" style="width:'+Math.min(mp,100)+'%;background:'+grad(mp)+'"></div></div></div>',
    '<div class="kcard"><div class="kl">Клиентов</div><div class="kv num">'+myClients.length+'</div><div class="ks"><span class="neu">в портфеле</span></div></div>',
    '<div class="kcard"><div class="kl">Ранрейт</div><div class="kv num">'+rr(totalFact,totalPlan)+'%</div><div class="ks"><span class="neu">по моим клиентам</span></div></div>'].join('');

  var rows=myClients.map(function(c){var cp=pct(c.fact,c.plan);
    var fCell=api?'<td class="r strong num" style="color:'+grad(cp)+'">'+fmt(c.fact)+'</td>':'<td class="r"><input class="inline-input" type="number" value="'+c.fact+'" onchange="setFact(\''+c.platform_org_id+'\',this.value)"></td>';
    return'<tr><td><a class="ext-link" href="'+c.url+'" target="_blank">'+c.name+' <span class="lk">↗</span></a></td>'+
      '<td class="r"><input class="inline-input" type="number" value="'+c.plan+'" onchange="setPlan(\''+c.platform_org_id+'\',this.value)"></td>'+
      fCell+
      '<td class="r"><span style="color:'+grad(cp)+';font-size:11px;font-weight:600" class="num">'+cp+'%</span></td>'+
      '<td class="r muted num">'+c.minLeft.toLocaleString('ru')+'</td>'+
      '<td class="r">'+daysBadge(daysTo(c.expiry))+'</td></tr>';
  }).join('');

  var table=myClients.length?'<table class="tbl"><thead><tr><th>Компания</th><th class="r">План ₽</th><th class="r">Факт'+(api?' (API)':'')+'</th><th class="r">%</th><th class="r">Мин ост.</th><th class="r">До прод.</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty-state">Нет клиентов в портфеле.<br>Клиенты привязываются автоматически по ответственному в платформе.</div>';
  var hint=api?'Факт из API — редактируй только план':'Вбивай план и факт по каждому клиенту — цифры сразу в базе';

  setApp('<div class="topbar"><div class="nav-left"><span class="brand">Кабинет менеджера</span>'+asSel+'<span class="save-hint'+(S.saveHint?' show':'')+'">✓ сохранено</span></div></div><div class="dept-kpi" style="grid-template-columns:repeat(3,1fr)">'+kH+'</div><div class="panel"><div class="panel-title">'+hint+'</div>'+table+'</div>');
}
window.setMgrAs=function(id){S.mgrAs=id;render();};
window.setPlan=function(id,v){saveClient(id,'monthly_plan',v);flashSave();};
window.setFact=function(id,v){saveClient(id,'monthly_fact',v);flashSave();};
function flashSave(){S.saveHint=true;render();setTimeout(function(){S.saveHint=false;render();},1500);}

/* ═══ MODAL ═══ */
function openModal(title,body,onSave){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="modal"><div class="modal-title">'+title+'</div>'+body+'<div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="msave">Сохранить</button></div></div>';
  m.classList.add('open');document.getElementById('msave').onclick=onSave;
}
window.closeModal=function(){var m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';};

/* ═══ RENDER ═══ */
function setApp(html){document.getElementById('app').innerHTML=roleBar()+html;}
function render(){
  if(S.loading){document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><div>Загружаю из Supabase…</div></div>';return;}
  if(S.role==='rop'){renderRop();return;}
  if(S.role==='mgr'){renderMgr();return;}
  if(S.dept)renderDept();else renderCo();
}
loadData();
</script>
</body></html>

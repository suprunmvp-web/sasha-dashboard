function buildCompanyMonthlyData(deals){
  // Группируем по YYYY-MM + dept
  var months={};
  deals.forEach(function(d){
    if(!d.deal_date)return;
    var sign=d.event_type==='refund'?-1:1;
    var amt=sign*(Number(d.amount)||0);
    if(amt<=0)return;
    var mk=d.deal_date.substring(0,7);
    var dept=d.dept_name||'—';
    if(!months[mk])months[mk]={};
    months[mk][dept]=(months[mk][dept]||0)+amt;
  });
  var keys=Object.keys(months).sort();
  if(!keys.length)return{months:[],depts:[]};
  var deptSet={};
  keys.forEach(function(mk){Object.keys(months[mk]).forEach(function(d){deptSet[d]=1;});});
  var depts=Object.keys(deptSet);
  var arr=[];
  var cur=new Date(keys[0]+'-01');
  var now=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(cur<=now){
    var mk2=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
    var row={month:mk2,total:0,byDept:{}};
    depts.forEach(function(d){var v=months[mk2]&&months[mk2][d]||0;row.byDept[d]=v;row.total+=v;});
    arr.push(row);
    cur.setMonth(cur.getMonth()+1);
  }
  return{months:arr,depts:depts};
}

function buildCompanyChartSVG(compData){
  var W=680,H=160,padL=8,padR=8,padB=28,padT=10;
  var drawW=W-padL-padR,drawH=H-padB-padT;
  var monthData=compData.months,depts=compData.depts;
  var n=monthData.length;if(!n)return'<div style="color:var(--text-3);font-size:12px;padding:20px 0;text-align:center">Нет данных</div>';
  var maxV=Math.max(1,Math.max.apply(null,monthData.map(function(m){return m.total;})));
  var slot=drawW/n;var bw=Math.max(4,Math.min(slot*0.68,48));
  var bars='';var labels='';
  monthData.forEach(function(m,i){
    var x=padL+i*slot+slot/2-bw/2;
    var totalH=m.total>0?Math.max(3,r(m.total/maxV*drawH)):0;
    var yBase=padT+drawH;
    var curY=yBase;
    // stacked segments bottom-up
    depts.forEach(function(dept,di){
      var v=m.byDept[dept]||0;if(!v)return;
      var segH=r(v/maxV*drawH);if(!segH)return;
      curY-=segH;
      var col=DEPT_COLORS[di%DEPT_COLORS.length];
      var tip=JSON.stringify([{n:dept,a:v}]).replace(/"/g,'&quot;');
      bars+='<rect class="chart-bar-seg" x="'+x+'" y="'+curY+'" width="'+bw+'" height="'+segH+'" rx="0" fill="'+col+'"'+
        ' data-month="'+m.month+'" data-total="'+m.total+'" data-clients="'+tip+'"'+
        ' onmouseover="showChartTip(event,this)" onmousemove="moveTip(event)" onmouseout="hideTip()"/>';
    });
    // Rounded top
    if(totalH>0){bars+='<rect x="'+x+'" y="'+(yBase-totalH)+'" width="'+bw+'" height="4" rx="3" fill="'+(DEPT_COLORS[(depts.findIndex(function(d){return m.byDept[d]>0;}))%DEPT_COLORS.length]+'" pointer-events="none"/>');}
    var show=n<=12||(i%3===0)||i===n-1;
    if(show){var mp=m.month.split('-');var lbl=MNS[Number(mp[1])-1]+(n>12&&(i===0||mp[1]==='01')?' '+mp[0]:'');labels+='<text x="'+(padL+i*slot+slot/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+lbl+'</text>';}
  });
  return'<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+bars+labels+'</svg>';
}

/* ═══ PASSWORD RECOVERY ═══ */
window.showForgot=function(){
  var el=document.getElementById('login-screen');
  el.innerHTML='<div class="login-card">'+
    '<div class="login-brand">Sasha<span class="a">AI</span></div>'+
    '<div class="login-back" onclick="showLogin()">‹ Назад</div>'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:6px">Сброс пароля</div>'+
    '<div style="font-size:12px;color:var(--text-2);margin-bottom:18px;line-height:1.5">Введи рабочий email — пришлём ссылку для сброса пароля</div>'+
    '<div class="login-field"><label>Email</label><input class="login-input" type="email" id="fg-email" placeholder="name@trysasha.ru"></div>'+
    '<button class="login-btn" id="fg-btn" onclick="doForgot()">Отправить письмо</button>'+
    '<div class="login-err" id="fg-err"></div>'+
    '</div>';
  setTimeout(function(){var e=document.getElementById('fg-email');if(e)e.focus();},50);
  document.getElementById('fg-email').addEventListener('keydown',function(e){if(e.key==='Enter')doForgot();});
};

window.doForgot=async function(){
  var email=(document.getElementById('fg-email').value||'').trim();
  var btn=document.getElementById('fg-btn');
  var err=document.getElementById('fg-err');
  if(!email){err.textContent='Введи email';return;}
  btn.disabled=true;btn.textContent='Отправляем...';
  try{
    var r=await fetch(SB_URL+'/auth/v1/recover',{
      method:'POST',
      headers:{'apikey':SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({email:email})
    });
    // Supabase всегда возвращает 200 (не раскрывает есть ли такой email)
    var card=document.querySelector('#login-screen .login-card');
    if(card){
      card.innerHTML='<div class="login-brand">Sasha<span class="a">AI</span></div>'+
        '<div class="login-success">'+
          '✓ Письмо отправлено на <strong>'+esc(email)+'</strong><br><br>'+
          'Проверь почту и перейди по ссылке для сброса пароля. Ссылка действует 24 часа.'+
        '</div>'+
        '<div class="login-sub" style="margin-top:20px"><a onclick="showLogin()">‹ Вернуться ко входу</a></div>';
    }
  }catch(e){
    err.textContent='Ошибка отправки. Попробуй ещё раз.';
    btn.disabled=false;btn.textContent='Отправить письмо';
  }
};

// Показываем форму для установки нового пароля (когда пришли по ссылке из письма)
function showResetPassword(accessToken){
  var el=document.getElementById('login-screen');
  el.style.display='flex';
  el.innerHTML='<div class="login-card">'+
    '<div class="login-brand">Sasha<span class="a">AI</span></div>'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:6px">Новый пароль</div>'+
    '<div style="font-size:12px;color:var(--text-2);margin-bottom:18px">Придумай новый пароль для входа</div>'+
    '<div class="login-field"><label>Новый пароль</label><input class="login-input" type="password" id="rp-new" placeholder="Минимум 6 символов"></div>'+
    '<div class="login-field" style="margin-top:12px"><label>Повтори пароль</label><input class="login-input" type="password" id="rp-conf" placeholder="Повтори пароль"></div>'+
    '<button class="login-btn" id="rp-btn" onclick="doResetPassword(&quot;'+accessToken+'&quot;)">Сохранить пароль</button>'+
    '<div class="login-err" id="rp-err"></div>'+
    '</div>';
  setTimeout(function(){var e=document.getElementById('rp-new');if(e)e.focus();},50);
}

window.doResetPassword=async function(token){
  var p1=(document.getElementById('rp-new').value||'').trim();
  var p2=(document.getElementById('rp-conf').value||'').trim();
  var btn=document.getElementById('rp-btn');
  var err=document.getElementById('rp-err');
  if(!p1||p1.length<6){err.textContent='Минимум 6 символов';return;}
  if(p1!==p2){err.textContent='Пароли не совпадают';return;}
  btn.disabled=true;btn.textContent='Сохраняем...';
  try{
    var r=await fetch(SB_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({password:p1})
    });
    var d=await r.json();
    if(d.error){err.textContent=d.error_description||'Ошибка. Попробуй снова.';btn.disabled=false;btn.textContent='Сохранить пароль';return;}
    // Чистим hash из URL
    if(history.replaceState)history.replaceState(null,'',window.location.pathname);
    showLogin('Пароль изменён — теперь войди с новым паролем');
  }catch(e){
    err.textContent='Ошибка. Попробуй снова.';
    btn.disabled=false;btn.textContent='Сохранить пароль';
  }
};

// Проверяем hash в URL при загрузке (Supabase редиректит сюда после recovery письма)
function checkRecoveryHash(){
  var hash=window.location.hash;
  if(!hash)return false;
  var params={};
  hash.substring(1).split('&').forEach(function(p){var kv=p.split('=');params[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});
  if(params.type==='recovery'&&params.access_token){
    showResetPassword(params.access_token);
    return true;
  }
  return false;
}

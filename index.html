function openDealModal(existing,preEmpId,preDeptId){
  var emps=RAW.employees.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var empOpts=emps.map(function(e){var arch=(e.fired_at||e.is_archived)?' (архив)':'';return'<option value="'+e.id+'">'+esc(e.name)+arch+'</option>';}).join('');
  var initEmp=existing?existing.employee_id:(preEmpId||(emps[0]&&emps[0].id));
  var body=
    '<div class="field"><label>Событие *</label><select id="dl-type" class="sel" style="width:100%;border-radius:8px"><option value="payment">Оплата</option><option value="refund">Возврат</option></select></div>'+
    '<div class="field"><label>Сотрудник *</label><select id="dl-emp" class="sel" style="width:100%;border-radius:8px" onchange="dealEmpChanged()">'+empOpts+'</select></div>'+
    '<div class="field"><label>Клиент *</label><div id="dl-cwrap"></div></div>'+
    '<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Сумма ₽ *</label><input id="dl-amt" type="number" placeholder="0"></div><div class="field" style="flex:1"><label>Мотивация % *</label><input id="dl-pct" type="number" placeholder="10" step="0.5"></div></div>'+
    '<div class="field"><label>Дата *</label><input id="dl-date" type="date" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Комментарий</label><input id="dl-note" placeholder="—"></div>';
  _dc={orgId:null,name:'',search:''};
  openModal(existing?'Редактировать сделку':'Добавить сделку',body,function(){saveDeal(existing,preDeptId);});
  setTimeout(function(){
    var es=document.getElementById('dl-emp');if(es&&initEmp)es.value=initEmp;
    if(existing){
      var et=document.getElementById('dl-type');if(et)et.value=existing.event_type||'payment';
      var ea=document.getElementById('dl-amt');if(ea)ea.value=existing.amount;
      var ep=document.getElementById('dl-pct');if(ep)ep.value=existing.motivation_pct;
      var ed=document.getElementById('dl-date');if(ed)ed.value=(existing.deal_date||'').substring(0,10);
      var en=document.getElementById('dl-note');if(en)en.value=existing.note||'';
    }
    rebuildCliUI(existing?existing.platform_org_id:null);
    setupDealVal();
  },0);
}
window.dealEmpChanged=function(){_dc={orgId:null,name:'',search:''};rebuildCliUI(null);};
function rebuildCliUI(preOrg){
  if(preOrg){var cl=(RAW.allClients||[]).find(function(c){return c.platform_org_id===preOrg;});if(cl){_dc.orgId=preOrg;_dc.name=cl.company_name||'';}}
  renderCliUI();
}
function renderCliUI(){
  var wrap=document.getElementById('dl-cwrap');if(!wrap)return;
  if(_dc.orgId){
    wrap.innerHTML='<div class="cli-selected"><span>'+esc(_dc.name)+'</span><button class="chg" onclick="clearDealCli()">Изменить</button></div>';
    validateDeal();return;
  }
  var empSel=document.getElementById('dl-emp');
  var emp=empSel?RAW.employees.find(function(e){return e.id===empSel.value;}):null;
  var puid=emp?emp.platform_user_id:null;
  var allC=RAW.allClients||[];
  var mine=allC.filter(function(c){return c.responsible_platform_user_id===puid;});
  var unassigned=allC.filter(function(c){return !c.responsible_platform_user_id;});
  var others=allC.filter(function(c){return c.responsible_platform_user_id&&c.responsible_platform_user_id!==puid;});
  var q=(_dc.search||'').toLowerCase();
  if(q){var fn=function(c){return(c.company_name||'').toLowerCase().indexOf(q)>=0;};mine=mine.filter(fn);unassigned=unassigned.filter(fn);others=others.filter(fn);}
  function makeOpts(list,sect,warn){
    if(!list.length)return'';
    return'<div class="cli-ds">'+sect+'</div>'+list.slice(0,60).map(function(c){return'<div class="cli-do" data-orgid="'+c.platform_org_id+'" data-name="'+esc(c.company_name||'')+'">'+esc(c.company_name||'—')+(warn?' <span style="color:var(--amber);font-size:10px">⚠ нет ответств. на платформе</span>':'')+'</div>';}).join('');
  }
  var dropHtml=makeOpts(mine,'Текущие клиенты сотрудника')+makeOpts(unassigned,'⚠ Без ответственного на платформе',true)+makeOpts(others,'Все остальные');
  if(!dropHtml)dropHtml='<div class="cli-empty">Не найдено</div>';
  wrap.innerHTML='<input id="dl-csearch" class="cli-search" placeholder="Поиск клиента..." value="'+esc(_dc.search||'')+'">'+
    '<div class="cli-drop" id="dl-cdrop">'+dropHtml+'</div>';
  setTimeout(function(){
    var si=document.getElementById('dl-csearch');
    if(si)si.oninput=function(){_dc.search=this.value;renderCliUI();setTimeout(function(){var x=document.getElementById('dl-csearch');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},0);};
    var drop=document.getElementById('dl-cdrop');
    if(drop)drop.addEventListener('click',function(e){var opt=e.target.closest('.cli-do');if(opt){_dc.orgId=opt.dataset.orgid;_dc.name=opt.dataset.name;renderCliUI();}});
    var si2=document.getElementById('dl-csearch');if(si2)si2.focus();
  },0);
  validateDeal();
}
window.clearDealCli=function(){_dc={orgId:null,name:'',search:''};renderCliUI();};
function setupDealVal(){['dl-type','dl-amt','dl-pct','dl-date'].forEach(function(id){var el=document.getElementById(id);if(el){el.oninput=validateDeal;el.onchange=validateDeal;}});}
function validateDeal(){
  var btn=document.getElementById('msave');if(!btn)return;
  function v(id){var el=document.getElementById(id);return el?el.value:'';}
  var amt=parseFloat(v('dl-amt'));
  var ok=v('dl-type')&&v('dl-emp')&&_dc.orgId&&amt>0&&v('dl-pct')!==''&&!isNaN(parseFloat(v('dl-pct')))&&v('dl-date');
  btn.disabled=!ok;
}
function saveDeal(existing,preDeptId){
  var btn=document.getElementById('msave');
  if(btn&&btn.disabled&&btn.dataset.saving)return;
  var type=document.getElementById('dl-type').value;
  var empId=document.getElementById('dl-emp').value;
  var orgId=_dc.orgId||null;
  var clientName=_dc.name||'';
  var amount=Number(document.getElementById('dl-amt').value)||0;
  var pct2=Number(document.getElementById('dl-pct').value)||0;
  var date=document.getElementById('dl-date').value||todayISO();
  var note=document.getElementById('dl-note').value||null;
  if(amount<=0||!orgId)return;
  if(btn){btn.disabled=true;btn.dataset.saving='1';btn.textContent='Сохраняю…';}
  var emp=RAW.employees.find(function(e){return e.id===empId;});
  var deptId=emp?emp.dept_id:(preDeptId||null);
  var dept=RAW.depts.find(function(x){return x.id===deptId;});
  var row={event_type:type,employee_id:empId,employee_name:emp?emp.name:'',platform_org_id:orgId,client_name:clientName,dept_id:deptId,dept_name:dept?dept.name:'',amount:amount,motivation_pct:pct2,deal_date:date,note:note};
  var req=existing?sbPatch('deals','id=eq.'+existing.id,row):sbPost('deals',row);
  req.then(function(){closeModal();refreshPeriod(true);flashSave();}).catch(function(e){
    if(btn){btn.disabled=false;delete btn.dataset.saving;btn.textContent='Сохранить';}
    alert('Не удалось сохранить сделку, попробуй ещё раз.'+(e&&e.message?'\n'+e.message:''));
  });
}

window.setPayLimit=function(v){S.payLimit=Number(v);S.payPage=0;render();};

function pagHtml(cur,tot,total){
  if(tot<=1&&total<=S.payLimit)return'';
  var pages=[];
  if(tot<=7){for(var i=0;i<tot;i++)pages.push(i);}
  else{pages=[0];if(cur>2)pages.push('…');for(var j=Math.max(1,cur-1);j<=Math.min(tot-2,cur+1);j++)pages.push(j);if(cur<tot-3)pages.push('…');pages.push(tot-1);}
  var btns=pages.map(function(p){if(p==='…')return'<span style="color:var(--text-3);padding:0 4px;font-size:12px">…</span>';return'<button class="pag-btn'+(p===cur?' on':'')+'" onclick="setPayPage('+p+')">'+(p+1)+'</button>';}).join('');
  return'<div class="pag"><span class="pag-info">'+total+' записей</span>'+
    '<button class="pag-btn"'+(cur===0?' disabled':'')+' onclick="setPayPage('+(cur-1)+')">‹</button>'+btns+
    '<button class="pag-btn"'+(cur>=tot-1?' disabled':'')+' onclick="setPayPage('+(cur+1)+')">›</button>'+
    '<select class="sel" onchange="setPayLimit(this.value)" style="margin-left:4px">'+[10,20,50].map(function(n){return'<option value="'+n+'"'+(S.payLimit===n?' selected':'')+'>'+n+'/стр.</option>';}).join('')+'</select></div>';
}
var _payEmpById={},_payClientById={};

  _payEmpById={};RAW.employees.forEach(function(e){_payEmpById[e.id]=e;});

function empName(d){return(_payEmpById[d.employee_id]||{}).name||d.employee_name||'—';}

function renderPayroll(){
  _refreshPayLookups();
  var deptOpts='<option value="all">Все отделы</option>'+DB.depts.concat(DB.archivedDepts.map(function(d){return{id:d.id,name:d.name+' (архив)'};})).map(function(d){return'<option value="'+d.id+'"'+(S.payDept===d.id?' selected':'')+'>'+esc(d.name)+'</option>';}).join('');
  var allEmps=RAW.employees.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var empOpts='<option value="all">Все сотрудники</option>'+allEmps.map(function(e){return'<option value="'+e.id+'"'+(S.payEmp===e.id?' selected':'')+'>'+esc(e.name)+(e.fired_at?' (архив)':'')+'</option>';}).join('');
  var filtered=S.dealsRaw.filter(function(d){
    if(S.payDept!=='all'&&d.dept_id!==S.payDept)return false;
    if(S.payEmp!=='all'&&d.employee_id!==S.payEmp)return false;
    if(S.paySearch&&!clientName(d).toLowerCase().includes(S.paySearch.toLowerCase()))return false;
    return true;
  });
  var byEmp={};
  filtered.forEach(function(d){var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);var comm=amt*(Number(d.motivation_pct)||0)/100;var k=d.employee_id||'—';var e=byEmp[k]||(byEmp[k]={name:empName(d),dept:deptName(d),fact:0,comm:0,count:0});e.fact+=amt;e.comm+=comm;e.count++;});
  var rowsArr=Object.keys(byEmp).map(function(k){return byEmp[k];}).sort(function(a,b){return b.comm-a.comm;});
  var totFact=rowsArr.reduce(function(a,e){return a+e.fact;},0);
  var totComm=rowsArr.reduce(function(a,e){return a+e.comm;},0);
  var totCount=rowsArr.reduce(function(a,e){return a+e.count;},0);
  var avgDeal=totCount>0?r(totFact/totCount):0;
  var kH=[
    '<div class="ck"><div class="ck-l">Выручка по фильтрам</div><div class="ck-v num">'+fmt(totFact)+'</div><div class="ck-s">средний чек '+fmt(avgDeal)+'</div></div>',
    '<div class="ck"><div class="ck-l">Сделок</div><div class="ck-v num">'+totCount+'</div><div class="ck-s">оплат и возвратов</div></div>',
    '<div class="ck"><div class="ck-l">Начислено мотивации</div><div class="ck-v num">'+fmt(totComm)+'</div><div class="ck-s">'+(totFact>0?r(totComm/totFact*100)+'% от выручки':'—')+'</div></div>',
    '<div class="ck"><div class="ck-l">Участвовали</div><div class="ck-v num">'+rowsArr.length+'</div><div class="ck-s">из '+RAW.employees.filter(function(e){return!e.fired_at&&!e.is_archived;}).length+' сотрудников</div></div>'
  ].join('');
  var sorted=filtered.slice().sort(function(a,b){return(b.deal_date||'').localeCompare(a.deal_date||'');});
  var total=sorted.length,tot=Math.max(1,Math.ceil(total/S.payLimit)),page=Math.min(S.payPage,tot-1);
  var paged=sorted.slice(page*S.payLimit,(page+1)*S.payLimit);
  var q=S.paySearch;
  var dealRows=paged.map(function(d){
    var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);var comm=amt*(Number(d.motivation_pct)||0)/100;
    var cn=esc(clientName(d));
    if(q){var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');cn=cn.replace(re,'<mark style="background:var(--accent-bg);border-radius:2px">$1</mark>');}
    return'<tr>'+
      '<td class="muted num">'+fmtD(d.deal_date)+'</td>'+
      '<td><span class="strong">'+esc(empName(d))+'</span></td>'+
      '<td class="muted">'+esc(deptName(d))+'</td>'+
      '<td>'+cn+(d.event_type==='refund'?' <span style="color:var(--red);font-size:10px">возврат</span>':'')+'</td>'+
      '<td class="r strong num"'+(amt<0?' style="color:var(--red)"':'')+'>'+fmt(amt)+'</td>'+
      '<td class="r muted num">'+(d.motivation_pct||0)+'%</td>'+
      '<td class="r strong num" style="color:var(--green)">'+fmt(comm)+'</td>'+
      '<td class="muted" style="font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.note||'')+'</td>'+
      '<td class="r" style="white-space:nowrap"><button class="btn sm ghost" onclick="editDeal(\''+d.id+'\')" title="Ред.">✎</button> <button class="btn sm danger" onclick="deleteDeal(\''+d.id+'\')" title="Удалить">✕</button></td>'+
    '</tr>';
  }).join('');
  var dealTable=paged.length?'<table class="tbl"><thead><tr><th>Дата</th><th>Сотрудник</th><th>Отдел</th><th>Компания</th><th class="r">Сумма</th><th class="r">%</th><th class="r">Начислено</th><th>Коммент.</th><th></th></tr></thead><tbody>'+dealRows+'</tbody></table>':
    '<div class="empty-state">Нет сделок по фильтрам.</div>';
  var summaryRows=rowsArr.map(function(e){var avgPct=e.fact!==0?r(e.comm/e.fact*100):0;return'<tr><td><span class="strong">'+esc(e.name)+'</span></td><td class="muted">'+esc(e.dept)+'</td><td class="r muted num">'+e.count+'</td><td class="r strong num">'+fmt(e.fact)+'</td><td class="r muted num">'+avgPct+'%</td><td class="r strong num" style="color:var(--green)">'+fmt(e.comm)+'</td></tr>';}).join('');
  var sumBlock=rowsArr.length?'<div class="panel"><div class="panel-title">Свод по сотрудникам</div><table class="tbl"><thead><tr><th>Сотрудник</th><th>Отдел</th><th class="r">Сделок</th><th class="r">Выручка</th><th class="r">Ср. %</th><th class="r">Начислено</th></tr></thead><tbody>'+summaryRows+'</tbody></table></div>':'';
  var filters='<div class="adm-head" style="gap:10px;flex-wrap:wrap">'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
      '<select class="sel" onchange="setPayDept(this.value)">'+deptOpts+'</select>'+
      '<select class="sel" onchange="setPayEmp(this.value)">'+empOpts+'</select>'+
      '<input id="pay-srch" class="search-inp" placeholder="Поиск по компании…" value="'+esc(S.paySearch)+'" oninput="setPaySearch(this.value)">'+
    '</div>'+
    '<button class="btn primary" onclick="exportPayroll()">↓ XLSX</button>'+
  '</div>';
  setApp('<div class="topbar"><div class="nav-left"><span class="brand">Логи оплат</span></div>'+calTrigger()+'</div>'+
    '<div class="ckpi">'+kH+'</div>'+
    '<div class="panel">'+filters+dealTable+pagHtml(page,tot,total)+'</div>'+sumBlock);
}
window.exportPayroll=function(){
  _refreshPayLookups();
  var filtered=S.dealsRaw.filter(function(d){
    if(S.payDept!=='all'&&d.dept_id!==S.payDept)return false;
    if(S.payEmp!=='all'&&d.employee_id!==S.payEmp)return false;
    if(S.paySearch&&!clientName(d).toLowerCase().includes(S.paySearch.toLowerCase()))return false;
    return true;
  });
  if(!filtered.length){alert('Нет сделок для выгрузки');return;}
  var deals=filtered.map(function(d){var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);return{'Дата':d.deal_date,'Событие':d.event_type==='refund'?'Возврат':'Оплата','Сотрудник':empName(d),'Отдел':deptName(d),'Клиент':clientName(d),'Сумма':amt,'Мотивация %':d.motivation_pct,'Начислено':amt*(Number(d.motivation_pct)||0)/100,'Комментарий':d.note||''};});
  var byEmp2={};filtered.forEach(function(d){var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);var k=d.employee_id||'—';var e=byEmp2[k]||(byEmp2[k]={'Сотрудник':empName(d),'Отдел':deptName(d),'Сделок':0,'Выручка':0,'Начислено':0});e['Сделок']++;e['Выручка']+=amt;e['Начислено']+=amt*(Number(d.motivation_pct)||0)/100;});
  var summary=Object.keys(byEmp2).map(function(k){return byEmp2[k];}).sort(function(a,b){return b['Начислено']-a['Начислено'];});
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Свод');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(deals),'Сделки');
  XLSX.writeFile(wb,'Логи_оплат_'+dateISO(S.rangeFrom)+'_'+dateISO(S.rangeTo)+'.xlsx');
};

var DEPT_COLORS=['#3D6BF5','#2ED3A7','#F5B544','#FB6E5B','#A78BFA','#38BDF8'];
var MNS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
S.empLifetime={};S.empMonthlyPlan={};
S.companyLifetime=null;S.companyLifetimeLoading=false;
var _tip=null;
function _getTip(){if(!_tip){_tip=document.createElement('div');_tip.className='chart-tip';document.body.appendChild(_tip);}return _tip;}
window.moveTip=function(e){_positionTip(e);};
/* key: 'co' | 'd:<dept_id>' | 'e:<employee_id>' — атрибуция как у выручки (deals.dept_id / employee_id) */
function revAttr(key){return' data-rev="'+key+'" onmouseenter="showRevTip(event,this)" onmousemove="moveTip(event)" onmouseleave="hideTip()"';}
function revBreakdown(key){
  var f;
  if(key==='co')f=function(){return true;};
  else if(key.indexOf('d:')===0){var did=key.slice(2);f=function(d){return d.dept_id===did;};}
  else{var eid=key.slice(2);f=function(d){return d.employee_id===eid;};}
  var names={};(RAW.allClients||[]).forEach(function(c){names[c.platform_org_id]=c.company_name;});
  var R={neu:{n:0,sum:0,cl:{}},rep:{n:0,sum:0,cl:{}},refund:0};
  (S.dealsRaw||[]).forEach(function(d){
    if(!f(d))return;
    var amt=Number(d.amount)||0;
    if(d.event_type==='refund'){R.refund+=amt;return;}
    var b=(S.firstPayByOrg||{})[dealOrgKey_(d)]===d.id?R.neu:R.rep;
    var nm=names[d.platform_org_id]||d.client_name||'—';
    b.n++;b.sum+=amt;b.cl[nm]=(b.cl[nm]||0)+amt;
  });
  return R;
}
function dealsWord_(n){var a=n%10,b=n%100;if(a===1&&b!==11)return'сделка';if(a>=2&&a<=4&&(b<12||b>14))return'сделки';return'сделок';}
window.showRevTip=function(e,el){
  var t=_getTip();t.classList.add('rev-tip');
  var key=el.getAttribute('data-rev')||'co';
  var title=key==='co'?'Вся компания':key.indexOf('d:')===0?((DB.depts.find(function(x){return x.id===key.slice(2);})||{}).name||'Отдел'):((RAW.employees.find(function(x){return x.id===key.slice(2);})||{}).name||'Сотрудник');
  if(!S._firstPayLoaded){t.innerHTML='<div class="rt-wait">Считаю первичку…</div>';}
  else{
    var R=revBreakdown(key);
    var col=function(head,b,cls){
      var list=Object.keys(b.cl).map(function(n){return[n,b.cl[n]];}).sort(function(x,y){return y[1]-x[1];});
      var rows=list.slice(0,6).map(function(x){return'<div class="rt-row"><span class="rt-nm">'+esc(x[0])+'</span><span class="rt-am">'+fmtShort(x[1])+'</span></div>';}).join('');
      if(list.length>6)rows+='<div class="rt-more">+ ещё '+(list.length-6)+' клиентов</div>';
      if(!list.length)rows='<div class="rt-more">нет</div>';
      return'<div><div class="rt-h '+cls+'">'+head+'</div><div class="rt-n">'+b.n+' <span>'+dealsWord_(b.n)+'</span></div><div class="rt-s">'+fmt(b.sum)+'</div>'+rows+'</div>';
    };
    var tot=R.neu.sum+R.rep.sum,pn=tot>0?Math.round(R.neu.sum/tot*100):0;
    t.innerHTML='<div class="rt-title">'+esc(title)+' · первичка '+pn+'%</div>'+
      '<div class="rt-bar"><div class="rt-bar-new" style="width:'+pn+'%"></div></div>'+
      '<div class="rt-grid">'+col('Первичные',R.neu,'new')+col('Повторные',R.rep,'rep')+'</div>'+
      (R.refund?'<div class="rt-ref">Возвраты: −'+fmt(R.refund)+'</div>':'');
  }
  t.style.display='block';_positionTip(e);
};
window.hideTip=function(){var t=_getTip();t.style.display='none';};
function _positionTip(e){
  var t=_getTip();var tw=t.offsetWidth||200,th=t.offsetHeight||100;
  var x=e.clientX+14,y=e.clientY-th/2;
  if(x+tw>window.innerWidth-8)x=e.clientX-tw-14;
  if(y<8)y=8;if(y+th>window.innerHeight-8)y=window.innerHeight-th-8;
  t.style.left=x+'px';t.style.top=y+'px';
}
function fmtRub(n){if(!n||n===0)return'0';var s=Math.round(n).toString();var result='';for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)result+=' ';result+=s[i];}return result;}
function fmtShort(n){
  if(!n||n===0)return'0';
  if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'М';
  if(n>=1000)return Math.round(n/1000)+'к';
  return String(Math.round(n));
}
function buildSmoothPath(pts){
  if(pts.length<2)return'';
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=1;i<pts.length;i++){
    var p0=pts[i-1],p1=pts[i];
    var cpx=(p0[0]+p1[0])/2;
    d+=' C'+cpx+','+p0[1]+' '+cpx+','+p1[1]+' '+p1[0]+','+p1[1];
  }
  return d;
}

  var deltaHtml='';
  if(prev>0&&total>0){
    var d=Math.round((total-prev)/prev*100);
    var col=d>=0?'var(--green)':'var(--red)';
    var sign=d>=0?'+':'';
    deltaHtml='<span style="font-size:10px;font-weight:600;color:'+col+';margin-left:6px">'+sign+d+'%</span>';
  }
  var rows=clients.slice(0,5).map(function(c){

      '<div class="chart-tip-row"><span class="chart-tip-name">'+esc(c.n)+'</span><span class="chart-tip-amt">'+fmt(c.a)+'</span></div>'+
      '<div style="height:2px;background:var(--border);border-radius:1px;margin-top:3px"><div style="height:2px;width:'+w+'%;background:var(--accent);border-radius:1px;opacity:.7"></div></div>'+
    '</div>';
  }).join('');
  if(clients.length>5)rows+='<div style="font-size:10px;color:var(--text-3);margin-top:2px">+ещё '+(clients.length-5)+' клиентов</div>';
  var emptyHtml=total===0?'<div style="font-size:11px;color:var(--text-3);padding:8px 0">Нет выручки за месяц</div>':'';
  t.innerHTML=
    '<div style="font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:8px;letter-spacing:.03em;text-transform:uppercase">'+mLabel+'</div>'+
    (total>0?'<div style="font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:baseline">'+fmt(total)+deltaHtml+'</div>':'') +
    emptyHtml+rows;
  t.style.display='block';
  _positionTip(e);
};
function buildRevenueChartSVG(monthData,opts){
  opts=opts||{};
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var ACC=dark?'#4D7CFE':'#3D6BF5';
  var ACC_PLAN=dark?'rgba(77,124,254,0.25)':'rgba(61,107,245,0.2)';
  var BRD=dark?'#2d3748':'#c8d3e0';
  var T3=dark?'#718096':'#7a8ba3';
  var SF3=dark?'#1C2230':'#e8edf4';
  var plan=opts.plan||0;
  var planMap=opts.planMap||{};
  var hasPlan=plan>0||Object.keys(planMap).length>0;
  var months12=[];
  for(var mi=11;mi>=0;mi--){
    var d=new Date(TODAY.getFullYear(),TODAY.getMonth()-mi,1);
    var mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    months12.push(mk);
  }
  var dataMap={};
  monthData.forEach(function(m){dataMap[m.month]=m;});
  var data12=months12.map(function(mk){return dataMap[mk]||{month:mk,total:0,clients:[]};});
  var W=680,H=190,PL=68,PR=12,PT=14,PB=30;
  var DW=W-PL-PR,DH=H-PT-PB;
  var n=12;
  var mx=Math.max.apply(null,data12.map(function(m){var mp=planMap[m.month]||plan||0;return Math.max(m.total||0,hasPlan?mp:0);}));
  if(mx<=0)mx=1000;
  var p10=Math.pow(10,Math.floor(Math.log10(mx)));
  var nice=Math.ceil(mx/p10*1.25)*p10;
  var out=[];
  var steps=4;
  for(var si=0;si<=steps;si++){
    var sv=Math.round(nice/steps*si);
    var sy=Math.round(PT+DH-(sv/nice*DH));
    if(si===0){out.push('<line x1="'+PL+'" y1="'+sy+'" x2="'+(W-PR)+'" y2="'+sy+'" stroke="'+BRD+'" stroke-width="1"/>');}
    else{out.push('<line x1="'+PL+'" y1="'+sy+'" x2="'+(W-PR)+'" y2="'+sy+'" stroke="'+BRD+'" stroke-width="1" stroke-dasharray="3,5" opacity="0.7"/>');}
    out.push('<text x="'+(PL-6)+'" y="'+(sy+3.5)+'" text-anchor="end" font-size="9" font-family="Inter,sans-serif" fill="'+T3+'">'+fmtRub(sv)+'</text>');
  }
  out.push('<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+DH)+'" stroke="'+BRD+'" stroke-width="1"/>');
  var slot=DW/n;
  var bw=hasPlan?Math.round(slot*0.34):Math.round(slot*0.62);
  var gap=hasPlan?2:0;
  var bars=[],xlabels=[];
  data12.forEach(function(m,i){
    var cx=Math.round(PL+i*slot+slot/2);
    var baseY=PT+DH;
    var prev=i>0?data12[i-1].total:0;
    var cl=JSON.stringify(m.clients).replace(/"/g,'&quot;');
    var hov=' data-month="'+m.month+'" data-total="'+m.total+'" data-prev="'+prev+'" data-clients="'+cl+'"'+
      ' onmouseover="showChartTip(event,this)" onmousemove="moveTip(event)" onmouseout="hideTip()"';
    bars.push('<rect x="'+Math.round(cx-slot/2)+'" y="'+PT+'" width="'+Math.round(slot)+'" height="'+DH+'" fill="transparent"'+hov+'/>');
    if(hasPlan){
      var monthPlan=planMap[m.month]||plan||0;
      var ph=monthPlan>0?Math.round(monthPlan/nice*DH):0;
      if(ph>0){
        var px=Math.round(cx-gap/2-bw);
        bars.push('<rect x="'+px+'" y="'+(baseY-ph)+'" width="'+bw+'" height="'+ph+'" rx="3" fill="'+ACC_PLAN+'"'+hov+'/>');
        bars.push('<rect x="'+px+'" y="'+(baseY-ph)+'" width="'+bw+'" height="4" rx="3" fill="'+ACC+'" opacity="0.25" pointer-events="none"/>');
      }
    }
    if(m.total>0){
      var fh=Math.max(4,Math.round(m.total/nice*DH));
      var fx=hasPlan?Math.round(cx+gap/2):Math.round(cx-bw/2);
      bars.push('<rect x="'+fx+'" y="'+(baseY-fh)+'" width="'+bw+'" height="'+fh+'" rx="3" fill="'+ACC+'" opacity="0.82" class="chart-bar-fact"'+hov+'/>');
      bars.push('<rect x="'+fx+'" y="'+(baseY-fh)+'" width="'+bw+'" height="5" rx="3" fill="'+ACC+'" pointer-events="none"/>');
    } else {
      var ex=hasPlan?Math.round(cx+gap/2):Math.round(cx-bw/2);
      bars.push('<rect x="'+ex+'" y="'+(baseY-5)+'" width="'+bw+'" height="5" rx="3" fill="'+SF3+'"'+hov+'/>');
    }
    var mp=m.month.split('-');
    var lbl=MNS[+mp[1]-1]+(i===0||mp[1]==='01'?' \''+mp[0].slice(2):'');
    xlabels.push('<text x="'+cx+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" font-family="Inter,sans-serif" fill="'+T3+'">'+lbl+'</text>');
  });
  out=out.concat(bars).concat(xlabels);
  var legend=hasPlan?'<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:'+T3+'">'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:'+ACC_PLAN+';border:1px solid '+ACC+';opacity:.6;display:inline-block"></span>План</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:'+ACC+';display:inline-block"></span>Факт</span>'
    +'</div>':'';
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">'+out.join('')+'</svg>'+legend;
}
function buildMonthlyData(deals){
  var months={};
  deals.forEach(function(d){
    if(!d.deal_date)return;
    var sign=d.event_type==='refund'?-1:1;
    var amt=sign*(Number(d.amount)||0);
    if(amt<=0)return;
    var mk=d.deal_date.substring(0,7);
    if(!months[mk])months[mk]={total:0,clients:{}};
    months[mk].total+=amt;
    var cn=d.client_name||d.platform_org_id||'—';
    months[mk].clients[cn]=(months[mk].clients[cn]||0)+amt;
  });
  var keys=Object.keys(months).sort();
  if(!keys.length)return[];
  var first=keys[0];
  var arr=[];
  var _fp=first.split('-');
  var cur=new Date(Number(_fp[0]),Number(_fp[1])-1,1);
  var now=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(cur<=now){
    var mk2=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
    var m=months[mk2]||{total:0,clients:{}};
    var clients=Object.keys(m.clients).map(function(n){return{n:n,a:m.clients[n]};}).sort(function(a,b){return b.a-a.a;});
    arr.push({month:mk2,total:m.total,clients:clients});
    cur.setMonth(cur.getMonth()+1);
  }
  return arr;
}
window.loadEmpLifetime=function(empId){
  S._lifeLoading=S._lifeLoading||{};
  if(S.empLifetime[empId]||S._lifeLoading[empId])return Promise.resolve();
  S._lifeLoading[empId]=true;
  return Promise.all([
    sbGetAll('deals?select=id,deal_date,amount,event_type,client_name,platform_org_id&employee_id=eq.'+empId+'&order=deal_date.asc,id'),
    sbGet('monthly_targets?select=year,month,plan_amount&employee_id=eq.'+empId+'&limit=1000')
  ]).then(function(res){
    S._lifeLoading[empId]=false;
    S.empLifetime[empId]=res[0]||[];
    var planMap={};
    (res[1]||[]).forEach(function(t){
      var mk=t.year+'-'+String(t.month).padStart(2,'0');
      planMap[mk]=(Number(t.plan_amount)||0);
    });
    S.empMonthlyPlan[empId]=planMap;
    render();
  });
};

function buildCompanyMonthlyData(deals){
  var months={};
  deals.forEach(function(d){
    if(!d.deal_date)return;
    var sign=d.event_type==='refund'?-1:1;
    var amt=sign*(Number(d.amount)||0);
    if(amt<=0)return;
    var mk=d.deal_date.substring(0,7);
    var dept=d.dept_name||'—';
    if(!months[mk])months[mk]={};
    months[mk][dept]=(months[mk][dept]||0)+amt;
  });
  var keys=Object.keys(months).sort();
  if(!keys.length)return{months:[],depts:[]};
  var deptSet={};
  keys.forEach(function(mk){Object.keys(months[mk]).forEach(function(d){deptSet[d]=1;});});
  var depts=Object.keys(deptSet);
  var arr=[];
  var cur=new Date(keys[0]+'-01');
  var now=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(cur<=now){
    var mk2=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
    var row={month:mk2,total:0,byDept:{}};
    depts.forEach(function(d){var v=months[mk2]&&months[mk2][d]||0;row.byDept[d]=v;row.total+=v;});
    arr.push(row);
    cur.setMonth(cur.getMonth()+1);
  }
  return{months:arr,depts:depts};
}
function buildCompanyChartSVG(compData){
  var W=680,H=160,padL=8,padR=8,padB=28,padT=10;
  var drawW=W-padL-padR,drawH=H-padB-padT;
  var monthData=compData.months,depts=compData.depts;
  var n=monthData.length;if(!n)return'<div style="color:var(--text-3);font-size:12px;padding:20px 0;text-align:center">Нет данных</div>';
  var maxV=Math.max(1,Math.max.apply(null,monthData.map(function(m){return m.total;})));
  var slot=drawW/n;var bw=Math.max(4,Math.min(slot*0.68,48));
  var bars='';var labels='';
  monthData.forEach(function(m,i){
    var x=padL+i*slot+slot/2-bw/2;
    var totalH=m.total>0?Math.max(3,r(m.total/maxV*drawH)):0;
    var yBase=padT+drawH;
    var curY=yBase;
    depts.forEach(function(dept,di){
      var v=m.byDept[dept]||0;if(!v)return;
      var segH=r(v/maxV*drawH);if(!segH)return;
      curY-=segH;
      var col=DEPT_COLORS[di%DEPT_COLORS.length];
      var tip=JSON.stringify([{n:dept,a:v}]).replace(/"/g,'&quot;');
      bars+='<rect class="chart-bar-seg" x="'+x+'" y="'+curY+'" width="'+bw+'" height="'+segH+'" rx="0" fill="'+col+'"'+
        ' data-month="'+m.month+'" data-total="'+m.total+'" data-clients="'+tip+'"'+
        ' onmouseover="showChartTip(event,this)" onmousemove="moveTip(event)" onmouseout="hideTip()"/>';
    });
    if(totalH>0){bars+='<rect x="'+x+'" y="'+(yBase-totalH)+'" width="'+bw+'" height="4" rx="3" fill="'+(DEPT_COLORS[(depts.findIndex(function(d){return m.byDept[d]>0;}))%DEPT_COLORS.length]+'" pointer-events="none"/>');}
    var show=n<=12||(i%3===0)||i===n-1;
    if(show){var mp=m.month.split('-');var lbl=MNS[Number(mp[1])-1]+(n>12&&(i===0||mp[1]==='01')?' '+mp[0]:'');labels+='<text x="'+(padL+i*slot+slot/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+lbl+'</text>';}
  });
  return'<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+bars+labels+'</svg>';
}

window.showForgot=function(){
  var el=document.getElementById('login-screen');
  el.innerHTML='<div class="login-card">'+
    '<div class="login-brand">Sasha<span class="a">AI</span></div>'+
    '<div class="login-back" onclick="showLogin()">‹ Назад</div>'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:6px">Сброс пароля</div>'+
    '<div style="font-size:12px;color:var(--text-2);margin-bottom:18px;line-height:1.5">Введи рабочий email — пришлём ссылку для сброса пароля</div>'+
    '<div class="login-field"><label>Email</label><input class="login-input" type="email" id="fg-email" placeholder="name@trysasha.ru"></div>'+
    '<button class="login-btn" id="fg-btn" onclick="doForgot()">Отправить письмо</button>'+
    '<div class="login-err" id="fg-err"></div>'+
    '</div>';
  setTimeout(function(){var e=document.getElementById('fg-email');if(e)e.focus();},50);
  document.getElementById('fg-email').addEventListener('keydown',function(e){if(e.key==='Enter')doForgot();});
};
window.doForgot=async function(){
  var email=(document.getElementById('fg-email').value||'').trim();
  var btn=document.getElementById('fg-btn');
  var err=document.getElementById('fg-err');
  if(!email){err.textContent='Введи email';return;}
  btn.disabled=true;btn.textContent='Отправляем...';
  try{
    var r=await fetch(SB_URL+'/auth/v1/recover',{
      method:'POST',
      headers:{'apikey':SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({email:email})
    });
    var card=document.querySelector('#login-screen .login-card');
    if(card){
      card.innerHTML='<div class="login-brand">Sasha<span class="a">AI</span></div>'+
        '<div class="login-success">'+
          '✓ Письмо отправлено на <strong>'+esc(email)+'</strong><br><br>'+
          'Проверь почту и перейди по ссылке для сброса пароля. Ссылка действует 24 часа.'+
        '</div>'+
        '<div class="login-sub" style="margin-top:20px"><a onclick="showLogin()">‹ Вернуться ко входу</a></div>';
    }
  }catch(e){
    err.textContent='Ошибка отправки. Попробуй ещё раз.';
    btn.disabled=false;btn.textContent='Отправить письмо';
  }
};
function showResetPassword(accessToken){
  var el=document.getElementById('login-screen');
  el.style.display='flex';
  el.innerHTML='<div class="login-card">'+
    '<div class="login-brand">Sasha<span class="a">AI</span></div>'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:6px">Новый пароль</div>'+
    '<div style="font-size:12px;color:var(--text-2);margin-bottom:18px">Придумай новый пароль для входа</div>'+
    '<div class="login-field"><label>Новый пароль</label><input class="login-input" type="password" id="rp-new" placeholder="Минимум 6 символов"></div>'+
    '<div class="login-field" style="margin-top:12px"><label>Повтори пароль</label><input class="login-input" type="password" id="rp-conf" placeholder="Повтори пароль"></div>'+
    '<button class="login-btn" id="rp-btn" onclick="doResetPassword(&quot;'+accessToken+'&quot;)">Сохранить пароль</button>'+
    '<div class="login-err" id="rp-err"></div>'+
    '</div>';
  setTimeout(function(){var e=document.getElementById('rp-new');if(e)e.focus();},50);
}
window.doResetPassword=async function(token){
  var p1=(document.getElementById('rp-new').value||'').trim();
  var p2=(document.getElementById('rp-conf').value||'').trim();
  var btn=document.getElementById('rp-btn');
  var err=document.getElementById('rp-err');
  if(!p1||p1.length<6){err.textContent='Минимум 6 символов';return;}
  if(p1!==p2){err.textContent='Пароли не совпадают';return;}
  btn.disabled=true;btn.textContent='Сохраняем...';
  try{
    var r=await fetch(SB_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({password:p1})
    });
    var d=await r.json();
    if(d.error){err.textContent=d.error_description||'Ошибка. Попробуй снова.';btn.disabled=false;btn.textContent='Сохранить пароль';return;}
    if(history.replaceState)history.replaceState(null,'',window.location.pathname);
    showLogin('Пароль изменён — теперь войди с новым паролем');
  }catch(e){
    err.textContent='Ошибка. Попробуй снова.';
    btn.disabled=false;btn.textContent='Сохранить пароль';
  }
};
function checkRecoveryHash(){
  var hash=window.location.hash;
  if(!hash)return false;
  var params={};
  hash.substring(1).split('&').forEach(function(p){var kv=p.split('=');params[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});
  if(params.type==='recovery'&&params.access_token){
    showResetPassword(params.access_token);
    return true;
  }
  return false;
}

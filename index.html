<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SashaAI · Аналитика продаж</title>
<style>
[data-theme="dark"]{
  --bg:#0B0E14;--surface:#11151F;--surface-2:#161B27;--surface-3:#1C2230;
  --border:#232a3a;--border-soft:#1a2030;
  --text:#E8ECF4;--text-2:#9AA4B8;--text-3:#5E6781;
  --accent:#4D7CFE;--accent-bg:rgba(77,124,254,.12);
  --green:#2ED3A7;--amber:#F5B544;--red:#FB6E5B;
  --green-bg:rgba(46,211,167,.12);--amber-bg:rgba(245,181,68,.12);--red-bg:rgba(251,110,91,.12);
  --shadow:0 24px 64px rgba(0,0,0,.5);--label-dark:#0B0E14;
}
[data-theme="light"]{
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#F0F2F7;--surface-3:#E6E9F0;
  --border:#DCE1EB;--border-soft:#E8ECF3;
  --text:#1A1F2E;--text-2:#5A6478;--text-3:#98A1B3;
  --accent:#3D6BF5;--accent-bg:rgba(61,107,245,.10);
  --green:#16A97F;--amber:#D89318;--red:#E25540;
  --green-bg:rgba(22,169,127,.12);--amber-bg:rgba(216,147,24,.12);--red-bg:rgba(226,85,64,.12);
  --shadow:0 16px 48px rgba(30,40,80,.16);--label-dark:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;transition:background .2s;}
.app{max-width:1040px;margin:0 auto;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.pos{color:var(--green);}.neg{color:var(--red);}.neu{color:var(--text-2);}
.rolebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:12px;flex-wrap:wrap;}
.role-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:11px;padding:3px;}
.role-btn{font-size:12px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text-2);cursor:pointer;transition:.15s;font-weight:500;display:flex;align-items:center;gap:6px;}
.role-btn.on{background:var(--accent);color:#fff;}
.role-btn:not(.on):hover{color:var(--text);}
.role-meta{font-size:11px;color:var(--text-3);}
.theme-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:12px;}
.back-btn{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);transition:.15s;}
.back-btn:hover{background:var(--surface-3);}
.brand{font-size:18px;font-weight:600;letter-spacing:-.01em;}
.brand .accent{color:var(--accent);}
.crumb-title{font-size:18px;font-weight:600;letter-spacing:-.01em;}
.cal-trigger{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text);transition:.15s;}
.cal-trigger:hover{border-color:var(--accent);}
.cal-trigger svg{opacity:.6;}
.cal-pop{position:absolute;right:0;top:48px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;z-index:50;box-shadow:var(--shadow);display:none;}
.cal-pop.open{display:block;}
.cal-wrap{position:relative;}
.cal-presets{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.cal-preset{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;}
.cal-preset:hover{border-color:var(--accent);color:var(--text);}
.cal-months{display:flex;gap:28px;}
.cal-mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-mtitle{font-size:13px;font-weight:600;}
.cal-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav:hover{background:var(--surface-3);color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,30px);gap:2px;}
.cal-dow{font-size:10px;color:var(--text-3);text-align:center;height:24px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;}
.cal-day{font-size:12px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:var(--text);}
.cal-day:hover{background:var(--surface-3);}
.cal-day.other{color:var(--text-3);}
.cal-day.in-range{background:var(--accent-bg);border-radius:0;}
.cal-day.range-start{background:var(--accent);color:#fff;border-radius:8px 0 0 8px;}
.cal-day.range-end{background:var(--accent);color:#fff;border-radius:0 8px 8px 0;}
.cal-day.range-single{background:var(--accent);color:#fff;border-radius:8px;}
.ckpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.ck{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;}
.ck-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:500;}
.ck-v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.ck-s{font-size:12px;margin-top:8px;color:var(--text-2);}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dept-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;}
.dept-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.dc-name{font-size:16px;font-weight:600;}
.dc-meta{font-size:11px;color:var(--text-3);margin-top:4px;}
.dc-badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600;}
.bg{background:var(--green-bg);color:var(--green);}.ba{background:var(--amber-bg);color:var(--amber);}.br{background:var(--red-bg);color:var(--red);}
.dc-fact{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
.dc-plan{font-size:12px;color:var(--text-3);margin-bottom:14px;}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.dc-stats{display:flex;justify-content:space-between;}
.dc-stat-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.dc-stat-v{font-size:15px;font-weight:600;margin-top:2px;}
.dept-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem;}
.kcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;}
.kl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:500;}
.kv{font-size:20px;font-weight:600;line-height:1;}
.ks{font-size:11px;margin-top:6px;}
.pbar{height:3px;background:var(--surface-3);border-radius:2px;margin-top:9px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;}
.tab-row{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:4px;width:fit-content;}
.tab{font-size:13px;padding:8px 18px;border-radius:9px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;}
.tab.on{background:var(--accent);color:#fff;}
.tab:not(.on):hover{color:var(--text);}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:20px 22px;}
.panel-title{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:16px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:var(--text-3);padding:0 12px 12px 0;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;}
.tbl th:hover{color:var(--text-2);}
.tbl th .sort{opacity:.4;font-size:9px;margin-left:2px;}
.tbl th.sorted{color:var(--accent);}.tbl th.sorted .sort{opacity:1;}
.tbl th.r,.tbl td.r{text-align:right;}
.tbl td{padding:13px 12px 13px 0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface-2);}
.tbl .muted{color:var(--text-2);}.tbl .strong{font-weight:600;}
.inbar{height:4px;width:70px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-left:auto;margin-top:5px;}
.inbar-f{height:100%;border-radius:2px;}
.ms-wrap{position:relative;margin-bottom:12px;}
.ms-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:30px;padding:7px 10px;min-height:44px;cursor:text;}
.ms-add{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-add:hover{border-color:var(--accent);color:var(--accent);}
.ms-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px 5px 11px;border-radius:20px;background:var(--accent-bg);color:var(--text);border:1px solid var(--border);}
.ms-chip.fired{background:var(--surface-3);color:var(--text-2);}
.ms-chip .x{cursor:pointer;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.6;}
.ms-chip .x:hover{opacity:1;background:var(--surface-3);}
.ms-hint{font-size:13px;color:var(--text-3);padding-left:4px;}
.ms-drop{position:absolute;left:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;z-index:40;box-shadow:var(--shadow);min-width:280px;display:none;max-height:340px;overflow-y:auto;}
.ms-drop.open{display:block;}
.ms-sect{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 6px;font-weight:600;}
.ms-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
.ms-opt:hover{background:var(--surface-3);}
.ms-opt .check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.ms-opt.sel .check{background:var(--accent);border-color:var(--accent);color:#fff;}
.ms-opt.fired{color:var(--text-3);}
.ms-opt.fired .fired-tag{font-size:10px;color:var(--text-3);margin-left:auto;background:var(--surface-3);padding:2px 7px;border-radius:10px;}
.mgr-cell{font-size:12px;color:var(--text-2);cursor:pointer;border-radius:6px;padding:3px 8px;display:inline-block;}
.mgr-cell:hover{background:var(--accent-bg);color:var(--accent);}
.mgr-cell.fired{color:var(--text-3);font-style:italic;}
.ext-link{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:600;}
.ext-link:hover{color:var(--accent);}
.lk{font-size:10px;opacity:.5;}
.days-badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;display:inline-block;}
.db-red{background:var(--red-bg);color:var(--red);}.db-amb{background:var(--amber-bg);color:var(--amber);}
.db-grn{background:var(--green-bg);color:var(--green);}.db-neu{background:var(--surface-3);color:var(--text-2);}
.empty-state{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
.adm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn{font-size:12px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;transition:.15s;font-weight:500;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-danger{color:var(--red);border-color:var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{font-size:11px;padding:5px 10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:500;}
.field input,.field select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.inline-input{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:13px;width:110px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums;}
.inline-input:focus{outline:none;border-color:var(--accent);}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
.status-dot .d{width:7px;height:7px;border-radius:50%;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;width:440px;max-width:92vw;box-shadow:var(--shadow);}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
.role-pill{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface-3);color:var(--text-2);}
.role-pill.tl{background:var(--accent-bg);color:var(--accent);}
.save-hint{font-size:11px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .3s;}
.save-hint.show{opacity:1;}
.dept-edit-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--text-3);}
.spinner{width:38px;height:38px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle{width:42px;height:24px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--accent);border-color:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.toggle.on .knob{left:21px;}
.toggle-label{font-size:13px;color:var(--text);}
.toggle-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-bg" id="modal"></div>
<script>
/* ═══════════════════════ SUPABASE ═══════════════════════ */
var SB_URL='https://qhpyrlhugpqgojwmarrw.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFocHlybGh1Z3BxZ29qd21hcnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTI4OTAsImV4cCI6MjA5NjIyODg5MH0.wlEY_Nm2T6Oe-WbH4lHJxdv_1-RjqgpNtBziTTGX2OQ';
function sbGet(path){return fetch(SB_URL+'/rest/v1/'+path,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();});}
function sbPatch(table,filter,data){return fetch(SB_URL+'/rest/v1/'+table+'?'+filter,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(data)}).then(function(r){return r.status;});}
function sbPost(table,data){return fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)}).then(function(r){return r.json();});}

/* ═══════════════════════ STATE ═══════════════════════ */
var TODAY=new Date();
var MONTHS_N=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var DOW=['пн','вт','ср','чт','пт','сб','вс'];
var DB=null;
var RAW={depts:[],employees:[],clients:[]};

var S={
  role:'cd',theme:'dark',loading:true,
  rangeFrom:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),
  rangeTo:new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0),
  calLeft:new Date(TODAY.getFullYear(),TODAY.getMonth(),1),calOpen:false,pick:0,
  dept:null,tab:'staff',
  clientMgrs:[],mgrDropOpen:false,
  cliSortKey:'minLeft',cliSortDir:1,
  staffSortKey:'fact',staffSortDir:-1,
  funnelMgrs:[],funnelMgrDrop:false,funnelTag:'Все',
  ropDept:null,mgrAs:null,saveHint:false,
  factMode:'manual'
};
function r(n){return Math.round(n);}
function fmt(n){n=n||0;if(n>=1000000)return(n/1000000).toFixed(1)+' млн';if(n>=1000)return r(n/1000)+'к';return String(r(n));}
function pct(f,p){return p>0?r(f/p*100):0;}
function gradColor(p){p=Math.max(0,Math.min(100,p))/100;var s=[[251,110,91],[245,181,68],[46,211,167]];var seg=p<.5?0:1,t=p<.5?p/.5:(p-.5)/.5;var a=s[seg],b=s[seg+1];return'rgb('+r(a[0]+(b[0]-a[0])*t)+','+r(a[1]+(b[1]-a[1])*t)+','+r(a[2]+(b[2]-a[2])*t)+')';}
function daysTo(ds){if(!ds)return null;return Math.max(0,r((new Date(ds)-TODAY)/86400000));}
function fmtCalLabel(){var f=S.rangeFrom,t=S.rangeTo;return MONTHS_N[f.getMonth()]+' '+String(f.getDate()).padStart(2,'0')+', '+f.getFullYear()+' — '+MONTHS_N[t.getMonth()]+' '+String(t.getDate()).padStart(2,'0')+', '+t.getFullYear();}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function runratePct(fact,plan){var from=S.rangeFrom,to=S.rangeTo;var elapsed=Math.max(1,r((Math.min(TODAY,to)-from)/86400000)+1);var total=Math.max(1,r((to-from)/86400000)+1);var expected=plan*(elapsed/total);return expected>0?r(fact/expected*100):0;}
function fmtRu(ds){if(!ds)return'—';var p=ds.split('-');return p[2]+'.'+p[1]+'.'+p[0];}

/* ═══════════════════════ DATA LOAD ═══════════════════════ */
function loadData(){
  S.loading=true;render();
  return Promise.all([
    sbGet('departments?select=*&order=created_at'),
    sbGet('employees?select=*&status=eq.active&order=name'),
    sbGet('clients?select=platform_org_id,company_name,platform_url,responsible_platform_user_id,minutes_total,minutes_left,monthly_plan,monthly_fact,subscription_status,subscription_name&is_archived=eq.false&responsible_platform_user_id=not.is.null&order=company_name&limit=3000')
  ]).then(function(res){
    RAW.depts=res[0]||[];RAW.employees=res[1]||[];RAW.clients=res[2]||[];
    buildDB();S.loading=false;
    if(S.ropDept===null&&DB.depts.length)S.ropDept=DB.depts[0].id;
    if(S.mgrAs===null){for(var i=0;i<DB.depts.length;i++){if(DB.depts[i].staff.length){S.mgrAs=DB.depts[i].staff[0].id;break;}}}
    render();
  }).catch(function(e){
    S.loading=false;
    document.getElementById('app').innerHTML='<div class="loading"><div style="color:var(--red)">Ошибка загрузки: '+e.message+'</div></div>';
  });
}

function buildDB(){
  var empByPlat={},empByDept={},clientsByUser={};
  RAW.employees.forEach(function(e){if(e.platform_user_id)empByPlat[e.platform_user_id]=e;});
  RAW.employees.forEach(function(e){if(!e.dept_id)return;(empByDept[e.dept_id]=empByDept[e.dept_id]||[]).push(e);});
  RAW.clients.forEach(function(c){var u=c.responsible_platform_user_id;if(!u)return;(clientsByUser[u]=clientsByUser[u]||[]).push(c);});

  var depts=RAW.depts.map(function(d){
    var emps=empByDept[d.id]||[];
    var lead=RAW.employees.find(function(e){return e.id===d.lead_employee_id;});
    var staff=emps.map(function(e){
      var ec=clientsByUser[e.platform_user_id]||[];
      return {id:e.platform_user_id,supaId:e.id,name:e.name,role:e.role==='lead'?'Тимлид':'Менеджер',hired:e.hired_at||'2025-01-01',
        fact:ec.reduce(function(a,c){return a+(c.monthly_fact||0);},0),
        plan:ec.reduce(function(a,c){return a+(c.monthly_plan||0);},0),
        clients:ec.length};
    });
    staff.sort(function(a,b){return (b.role==='Тимлид')-(a.role==='Тимлид');});
    var deptClients=emps.reduce(function(a,e){return a.concat(clientsByUser[e.platform_user_id]||[]);},[]);
    var clientsList=deptClients.map(function(c){
      return {platform_org_id:c.platform_org_id,name:c.company_name||'—',mgr:c.responsible_platform_user_id,
        url:c.platform_url||'#',plan:c.monthly_plan||0,fact:c.monthly_fact||0,
        minSpent:Math.max(0,(c.minutes_total||0)-(c.minutes_left||0)),minLeft:c.minutes_left||0,
        expiry:null,sub:c.subscription_name||'free'};
    });
    var deptFact=staff.reduce(function(a,m){return a+m.fact;},0);
    var paying=deptClients.filter(function(c){return c.subscription_status==='active';}).length;
    return {id:d.id,name:d.name,tl:lead?lead.name:'—',leadId:d.lead_employee_id,
      fact:deptFact,plan:d.monthly_plan||0,
      arpu:deptClients.length?r(deptFact/deptClients.length):0,ltv:0,ret:0,paying:paying,
      staff:staff,former:[],
      funnels:{'Все':[{s:'Лидов взято в работу',f:0,p:0},{s:'Квалифицировано',f:0,p:0},{s:'Встреч назначено',f:0,p:0},{s:'Встреч проведено',f:0,p:0},{s:'Счетов выставлено',f:0,p:0},{s:'Оплат получено',f:0,p:0}]},
      tagStats:{},clients:clientsList};
  });

  DB={company:{
    fact:depts.reduce(function(a,d){return a+d.fact;},0),
    plan:depts.reduce(function(a,d){return a+d.plan;},0),
    clients:depts.reduce(function(a,d){return a+d.clients.length;},0),
    paying:depts.reduce(function(a,d){return a+d.paying;},0),
    newC:0,churnC:0,potential:0},depts:depts};
}

function allPeople(d){return d.staff.concat((d.former||[]).map(function(f){return{id:f.id,name:f.name,role:f.role,fired:true,firedDate:f.firedDate};}));}
function person(d,id){return allPeople(d).find(function(x){return x.id===id;});}

function buildMonth(base){var y=base.getFullYear(),m=base.getMonth();var first=new Date(y,m,1);var sd=(first.getDay()+6)%7;var days=[];for(var i=0;i<sd;i++)days.push({d:new Date(y,m,1-(sd-i)),other:true});var dim=new Date(y,m+1,0).getDate();for(var k=1;k<=dim;k++)days.push({d:new Date(y,m,k),other:false});while(days.length%7!==0){var l=days[days.length-1].d;days.push({d:new Date(l.getFullYear(),l.getMonth(),l.getDate()+1),other:true});}return days;}
function renderCalMonth(base){var days=buildMonth(base);var cells=DOW.map(function(d){return'<div class="cal-dow">'+d+'</div>';}).join('');days.forEach(function(o){var cls='cal-day'+(o.other?' other':'');var t=o.d.getTime(),f=S.rangeFrom.getTime(),tt=S.rangeTo.getTime();if(sameDay(o.d,S.rangeFrom)&&sameDay(o.d,S.rangeTo))cls+=' range-single';else if(sameDay(o.d,S.rangeFrom))cls+=' range-start';else if(sameDay(o.d,S.rangeTo))cls+=' range-end';else if(t>f&&t<tt)cls+=' in-range';cells+='<div class="'+cls+'" onclick="pickDay('+o.d.getFullYear()+','+o.d.getMonth()+','+o.d.getDate()+')">'+o.d.getDate()+'</div>';});return'<div class="cal-grid">'+cells+'</div>';}
function renderCal(){var left=S.calLeft;var pr=['7 дней','30 дней','Этот месяц','Квартал'];var ph=pr.map(function(p,i){return'<button class="cal-preset" onclick="applyPreset('+i+')">'+p+'</button>';}).join('');var right=new Date(left.getFullYear(),left.getMonth()+1,1);return'<div class="cal-presets">'+ph+'</div><div class="cal-months"><div class="cal-month"><div class="cal-mhead"><button class="cal-nav" onclick="calShift(-1)">‹</button><span class="cal-mtitle">'+MONTHS_N[left.getMonth()]+' '+left.getFullYear()+'</span><span style="width:28px"></span></div>'+renderCalMonth(left)+'</div><div class="cal-month"><div class="cal-mhead"><span style="width:28px"></span><span class="cal-mtitle">'+MONTHS_N[right.getMonth()]+' '+right.getFullYear()+'</span><button class="cal-nav" onclick="calShift(1)">›</button></div>'+renderCalMonth(right)+'</div></div>';}
window.calShift=function(dir){S.calLeft=new Date(S.calLeft.getFullYear(),S.calLeft.getMonth()+dir,1);render();};
window.pickDay=function(y,m,d){var p=new Date(y,m,d);if(S.pick===0){S.rangeFrom=p;S.rangeTo=p;S.pick=1;}else{if(p.getTime()<S.rangeFrom.getTime()){S.rangeTo=S.rangeFrom;S.rangeFrom=p;}else S.rangeTo=p;S.pick=0;}render();};
window.applyPreset=function(i){var p=[{days:7},{days:30},{tm:1},{days:90}][i];if(p.tm){S.rangeFrom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);S.rangeTo=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0);}else{S.rangeTo=new Date(TODAY);S.rangeFrom=new Date(TODAY.getTime()-(p.days-1)*86400000);}S.calLeft=new Date(S.rangeFrom.getFullYear(),S.rangeFrom.getMonth(),1);S.pick=0;render();};
window.toggleCal=function(e){e.stopPropagation();S.calOpen=!S.calOpen;render();};
document.addEventListener('click',function(e){var ch=false;if(S.calOpen&&!e.target.closest('.cal-wrap')){S.calOpen=false;ch=true;}if(S.mgrDropOpen&&!e.target.closest('#ms-clients')){S.mgrDropOpen=false;ch=true;}if(S.funnelMgrDrop&&!e.target.closest('#ms-funnel')){S.funnelMgrDrop=false;ch=true;}if(ch)render();});

  var d=DB.depts.find(function(x){return x.id===S.ropDept;})||DB.depts[0];
  var deptOpts=DB.depts.map(function(x){return'<option value="'+x.id+'"'+(x.id===S.ropDept?' selected':'')+'>'+x.name+'</option>';}).join('');
  var staffRows=d?d.staff.map(function(m){return'<tr><td><span class="strong">'+m.name+'</span></td><td><span class="role-pill'+(m.role==='Тимлид'?' tl':'')+'">'+m.role+'</span></td><td class="muted num">'+fmtRu(m.hired)+'</td><td><span class="status-dot"><span class="d" style="background:var(--green)"></span>работает</span></td><td class="r muted num">'+m.clients+'</td><td class="r"><button class="btn btn-sm" onclick="reassignEmp(\''+m.supaId+'\')">Перевести</button></td></tr>';}).join(''):'';

  /* unassigned employees */
  var unassigned=RAW.employees.filter(function(e){return !e.dept_id;});
  var unaBlock='';
  if(unassigned.length){
    var unaRows=unassigned.map(function(e){return'<tr style="opacity:.75"><td>'+e.name+'</td><td><span class="role-pill">'+(e.role==='lead'?'Тимлид':'Менеджер')+'</span></td><td class="r"><button class="btn btn-sm btn-primary" onclick="reassignEmp(\''+e.id+'\')">Назначить в отдел</button></td></tr>';}).join('');
    unaBlock='<div class="panel" style="margin-bottom:14px"><div class="panel-title">Без отдела ('+unassigned.length+') — раскидай по отделам</div><table class="tbl"><thead><tr><th>Имя</th><th>Роль</th><th class="r">Действие</th></tr></thead><tbody>'+unaRows+'</tbody></table></div>';
  }

  /* fact mode toggle */
  var toggleBlock='<div class="panel" style="margin-bottom:14px"><div class="panel-title">Источник факта выручки</div><div class="toggle-wrap"><div class="toggle'+(S.factMode==='api'?' on':'')+'" onclick="toggleFactMode()"><div class="knob"></div></div><div><div class="toggle-label">'+(S.factMode==='api'?'Автоматически (API)':'Менеджеры заполняют руками')+'</div><div class="toggle-sub">'+(S.factMode==='api'?'выручка тянется из интеграции — менеджеры не редактируют':'менеджеры вбивают факт по каждому клиенту вручную')+'</div></div></div></div>';

  var deptCards=DB.depts.map(function(x){return'<div class="dept-edit-card"><div><div class="strong">'+x.name+'</div><div class="muted" style="font-size:11px;margin-top:3px">'+x.tl+' · план '+fmt(x.plan)+' · '+x.staff.length+' чел.</div></div><button class="btn btn-sm" onclick="editDept(\''+x.id+'\')">Настроить</button></div>';}).join('');

  setApp(
    '<div class="topbar"><div class="nav-left"><span class="brand">Управление отделами</span></div></div>'+
    toggleBlock+
    '<div class="panel" style="margin-bottom:14px"><div class="adm-head"><div style="display:flex;align-items:center;gap:12px"><div class="panel-title" style="margin:0">Сотрудники</div><select class="field" style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setRopDept(this.value)">'+deptOpts+'</select></div></div>'+
    (d&&d.staff.length?'<table class="tbl"><thead><tr><th>Имя</th><th>Роль</th><th>Дата найма</th><th>Статус</th><th class="r">Клиентов</th><th class="r">Действие</th></tr></thead><tbody>'+staffRows+'</tbody></table>':'<div class="empty-state">В отделе пока нет сотрудников — назначь из пула ниже</div>')+'</div>'+
    unaBlock+
    '<div class="panel"><div class="adm-head"><div class="panel-title" style="margin:0">Отделы компании</div><button class="btn btn-primary" onclick="createDept()">+ Создать отдел</button></div>'+deptCards+'</div>'
  );
}
window.setRopDept=function(id){S.ropDept=id;render();};
window.toggleFactMode=function(){S.factMode=S.factMode==='manual'?'api':'manual';render();};

window.reassignEmp=function(supaId){
  var emp=RAW.employees.find(function(e){return e.id===supaId;});
  var opts=DB.depts.map(function(x){return'<option value="'+x.id+'"'+(emp&&emp.dept_id===x.id?' selected':'')+'>'+x.name+'</option>';}).join('');
  openModal('Перевести сотрудника','<p style="font-size:13px;color:var(--text-2);margin-bottom:14px">'+(emp?emp.name:'')+'</p><div class="field"><label>Отдел</label><select id="re-dept">'+opts+'</select></div>',
  function(){var dept=document.getElementById('re-dept').value;assignEmpDept(supaId,dept);closeModal();render();});
};
window.editDept=function(id){var x=DB.depts.find(function(z){return z.id===id;});openModal('Настройка отдела','<div class="field" style="margin-bottom:12px"><label>Название</label><input id="d-name" value="'+x.name+'"></div><div class="field"><label>План отдела, ₽</label><input id="d-plan" type="number" value="'+x.plan+'"></div>',function(){var nm=document.getElementById('d-name').value;var pl=Number(document.getElementById('d-plan').value)||x.plan;sbPatch('departments','id=eq.'+id,{name:nm,monthly_plan:pl});RAW.depts.forEach(function(dd){if(dd.id===id){dd.name=nm;dd.monthly_plan=pl;}});buildDB();closeModal();render();});};
window.createDept=function(){
  var leadOpts='<option value="">— без тимлида —</option>'+RAW.employees.map(function(e){return'<option value="'+e.id+'">'+e.name+'</option>';}).join('');
  openModal('Новый отдел','<div class="field" style="margin-bottom:12px"><label>Название отдела</label><input id="nd-name" placeholder="Отдел Иванцова"></div><div class="field" style="margin-bottom:12px"><label>Тимлид</label><select id="nd-lead">'+leadOpts+'</select></div><div class="field"><label>План отдела, ₽</label><input id="nd-plan" type="number" value="3000000"></div>',
  function(){var nm=document.getElementById('nd-name').value.trim();if(!nm)return;var lead=document.getElementById('nd-lead').value||null;var plan=Number(document.getElementById('nd-plan').value)||0;
    sbPost('departments',{name:nm,lead_employee_id:lead,monthly_plan:plan}).then(function(res){
      var newDept=res&&res[0];RAW.depts.push(newDept);
      if(lead&&newDept){sbPatch('employees','id=eq.'+lead,{dept_id:newDept.id,role:'lead'});RAW.employees.forEach(function(e){if(e.id===lead){e.dept_id=newDept.id;e.role='lead';}});}
      buildDB();closeModal();render();
    });
  });
};

/* ═══════════════════════ МЕНЕДЖЕР ═══════════════════════ */
function renderMgr(){
  var d=DB.depts.find(function(x){return x.staff.some(function(m){return m.id===S.mgrAs;});});
  if(!d){setApp('<div class="topbar"><div class="nav-left"><span class="brand">Кабинет менеджера</span></div></div><div class="empty-state">Нет назначенных менеджеров. Зайди в РОП и раскидай людей по отделам.</div>');return;}
  var me=d.staff.find(function(m){return m.id===S.mgrAs;});
  var myClients=d.clients.filter(function(c){return c.mgr===S.mgrAs;});
  var allMgrs=[];DB.depts.forEach(function(dd){dd.staff.forEach(function(m){allMgrs.push({id:m.id,name:m.name});});});
  var asSel='<select class="field" style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setMgrAs(this.value)">'+allMgrs.map(function(m){return'<option value="'+m.id+'"'+(m.id===S.mgrAs?' selected':'')+'>'+m.name+'</option>';}).join('')+'</select>';

  var totalPlan=myClients.reduce(function(a,c){return a+c.plan;},0);
  var totalFact=myClients.reduce(function(a,c){return a+c.fact;},0);
  var mp=pct(totalFact,totalPlan);
  var apiMode=S.factMode==='api';
  var kpis=[
    {l:'Мой план',v:fmt(totalPlan),s:'факт '+fmt(totalFact)+' · '+mp+'%',bar:mp,bc:gradColor(mp)},
    {l:'Клиентов',v:myClients.length,s:'в портфеле',raw:true},
    {l:'Ранрейт',v:runratePct(totalFact,totalPlan)+'%',s:'<span class="neu">по моим клиентам</span>',raw:true},
  ];
  var kH=kpis.map(function(k){var b=k.bar!=null?'<div class="pbar"><div class="pfill" style="width:'+Math.min(k.bar,100)+'%;background:'+k.bc+'"></div></div>':'';return'<div class="kcard"><div class="kl">'+k.l+'</div><div class="kv num">'+k.v+'</div><div class="ks">'+(k.raw?k.s:'<span class="neu">'+k.s+'</span>')+'</div>'+b+'</div>';}).join('');

  var rows=myClients.map(function(c){var cp=pct(c.fact,c.plan);
    var factCell=apiMode
      ?'<td class="r strong num" style="color:'+gradColor(cp)+'">'+fmt(c.fact)+'</td>'
      :'<td class="r"><input class="inline-input" type="number" value="'+c.fact+'" onchange="setClientFact(\''+c.platform_org_id+'\',this.value)"></td>';
    return'<tr><td><a class="ext-link" href="'+c.url+'" target="_blank">'+c.name+' <span class="lk">↗</span></a></td><td class="r"><input class="inline-input" type="number" value="'+c.plan+'" onchange="setClientPlan(\''+c.platform_org_id+'\',this.value)"></td>'+factCell+'<td class="r"><span class="num" style="color:'+gradColor(cp)+';font-size:11px;font-weight:600">'+cp+'%</span></td><td class="r muted num">'+c.minLeft.toLocaleString('ru')+'</td></tr>';}).join('');
  var table=myClients.length>0?'<table class="tbl"><thead><tr><th>Компания</th><th class="r">Мой план ₽</th><th class="r">Факт '+(apiMode?'(API)':'₽')+'</th><th class="r">%</th><th class="r">Минут ост.</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty-state">Нет клиентов в портфеле</div>';
  var hint=apiMode?'Факт тянется из API — редактируешь только план':'Вбивай план и факт по каждому клиенту — сумма = твой результат';

  setApp(
    '<div class="topbar"><div class="nav-left"><span class="brand">Кабинет менеджера</span>'+asSel+'<span class="save-hint'+(S.saveHint?' show':'')+'">✓ сохранено</span></div></div>'+
    '<div class="dept-kpi" style="grid-template-columns:repeat(3,1fr)">'+kH+'</div>'+
    '<div class="panel"><div class="panel-title">Мои клиенты — '+hint+'</div>'+table+'</div>'
  );
}
window.setMgrAs=function(id){S.mgrAs=id;render();};
window.setClientPlan=function(orgId,val){saveClientField(orgId,'monthly_plan',Number(val)||0);flashSave();};
window.setClientFact=function(orgId,val){saveClientField(orgId,'monthly_fact',Number(val)||0);flashSave();};
function flashSave(){S.saveHint=true;render();setTimeout(function(){S.saveHint=false;render();},1500);}

/* ═══════════════════════ MODAL ═══════════════════════ */
function openModal(title,bodyHtml,onSave){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="modal"><div class="modal-title">'+title+'</div>'+bodyHtml+'<div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="modal-save">Сохранить</button></div></div>';
  m.classList.add('open');document.getElementById('modal-save').onclick=onSave;
}
window.closeModal=function(){var m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';};

/* ═══════════════════════ RENDER ═══════════════════════ */
function _setApp(html){document.getElementById('app').innerHTML=html;}
function setApp(html){_setApp(roleBar()+html);}
function render(){
  if(S.loading){document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><div>Загружаю данные из Supabase…</div></div>';return;}
  if(!DB){return;}
  if(S.role==='rop'){renderRop();return;}
  if(S.role==='mgr'){renderMgr();return;}
  if(S.dept)renderDept();else renderCo();
}
loadData();
</script>
</body></html>

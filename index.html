<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:1.5rem;-webkit-font-smoothing:antialiased;}
.app{max-width:1060px;margin:0 auto;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

.role-btn{font-size:12px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;}
.role-btn.on{background:var(--accent);color:#fff;}
.role-btn:not(.on):hover{color:var(--text);}
.role-meta{font-size:11px;color:var(--text-3);}
.bar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn{font-size:12px;padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:10px;}
.back-btn{font-size:13px;color:var(--accent);cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);}
.brand{font-size:18px;font-weight:600;letter-spacing:-.01em;}
.brand .accent{color:var(--accent);}
.crumb-title{font-size:18px;font-weight:600;}
.cal-trigger{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text);}
.cal-trigger svg{opacity:.6;}
.cal-pop{position:absolute;right:0;top:48px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;z-index:50;box-shadow:var(--shadow);display:none;}
.cal-pop.open{display:block;}
.cal-wrap{position:relative;}
.cal-presets{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.cal-preset{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;}
.cal-months{display:flex;gap:28px;}
.cal-mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-mtitle{font-size:13px;font-weight:600;}
.cal-nav{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,30px);gap:2px;}
.cal-dow{font-size:10px;color:var(--text-3);text-align:center;height:24px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;}
.cal-day{font-size:12px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:var(--text);}
.cal-day:hover{background:var(--surface-3);}
.cal-day.other{color:var(--text-3);}
.cal-day.disabled{opacity:.25;pointer-events:none;cursor:default;}
.cal-day.in-range{background:var(--accent-bg);border-radius:0;}
.cal-day.range-start{background:var(--accent);color:#fff;border-radius:8px 0 0 8px;}
.cal-day.range-end{background:var(--accent);color:#fff;border-radius:0 8px 8px 0;}
.cal-day.range-single{background:var(--accent);color:#fff;border-radius:8px;}
.ckpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.ck{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;}
.ck-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px;}
.ck-v{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.ck-s{font-size:12px;margin-top:8px;color:var(--text-2);}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dept-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;}
.dept-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.dc-name{font-size:16px;font-weight:600;}
.dc-meta{font-size:11px;color:var(--text-3);margin-top:4px;}
.dc-badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600;}
.bg{background:var(--green-bg);color:var(--green);}.ba{background:var(--amber-bg);color:var(--amber);}.br{background:var(--red-bg);color:var(--red);}
.dc-fact{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
.dc-plan{font-size:12px;color:var(--text-3);margin-bottom:14px;}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;border-radius:6px;transition:width .5s;}
.dc-stats{display:flex;justify-content:space-between;}
.dc-stat-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.dc-stat-v{font-size:15px;font-weight:600;margin-top:2px;}
.dept-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem;}
.kcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;}
.kl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:500;}
.kv{font-size:18px;font-weight:600;line-height:1;}
.ks{font-size:11px;margin-top:6px;}
.pbar{height:3px;background:var(--surface-3);border-radius:2px;margin-top:9px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;}
.tab-row{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:4px;width:fit-content;}
.tab{font-size:13px;padding:8px 18px;border-radius:9px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;}
.tab.on{background:var(--accent);color:#fff;}
.tab:not(.on):hover{color:var(--text);}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
.panel-title{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:16px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:var(--text-3);padding:0 10px 12px 0;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;}
.tbl th:hover{color:var(--text-2);}
.tbl th .sort{opacity:.4;font-size:9px;margin-left:2px;}
.tbl th.sorted{color:var(--accent);}.tbl th.sorted .sort{opacity:1;}
.tbl th.r,.tbl td.r{text-align:right;}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface-2);}
.tbl .muted{color:var(--text-2);}.tbl .strong{font-weight:600;}
.inbar{height:4px;width:60px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-left:auto;margin-top:5px;}
.inbar-f{height:100%;border-radius:2px;}
.ms-wrap{position:relative;margin-bottom:12px;}
.ms-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:30px;padding:7px 10px;min-height:44px;cursor:text;}
.ms-add{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-add:hover{border-color:var(--accent);color:var(--accent);}
.ms-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px 5px 11px;border-radius:20px;background:var(--accent-bg);border:1px solid var(--border);}
.ms-chip .x{cursor:pointer;opacity:.6;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ms-chip .x:hover{opacity:1;}
.ms-hint{font-size:13px;color:var(--text-3);padding-left:4px;}
.ms-drop{position:absolute;left:0;top:52px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;z-index:40;box-shadow:var(--shadow);min-width:260px;display:none;max-height:320px;overflow-y:auto;}
.ms-drop.open{display:block;}
.ms-sect{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 6px;font-weight:600;}
.ms-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
.ms-opt:hover{background:var(--surface-3);}
.ms-opt .check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.ms-opt.sel .check{background:var(--accent);border-color:var(--accent);color:#fff;}
.ext-link{color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:600;}
.ext-link:hover{color:var(--accent);}
.lk{font-size:10px;opacity:.5;}
.days-badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;display:inline-block;}
.db-red{background:var(--red-bg);color:var(--red);}.db-amb{background:var(--amber-bg);color:var(--amber);}
.db-grn{background:var(--green-bg);color:var(--green);}.db-neu{background:var(--surface-3);color:var(--text-2);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;line-height:1.7;}
.adm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.btn{font-size:12px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:500;}
.btn:hover{border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-sm{font-size:11px;padding:5px 10px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-3);}
.btn-ghost:hover{color:var(--text);border-color:var(--border);}
.btn-danger{color:var(--red);border-color:transparent;}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red-bg);}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:500;}
.field input,.field select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.inline-input{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:13px;width:130px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums;}
.inline-input:focus{outline:none;border-color:var(--accent);}
.role-select{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;color:var(--text);font-size:11px;font-family:inherit;cursor:pointer;}
.role-select:focus{outline:none;border-color:var(--accent);}
.role-select.lead{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
.status-dot .d{width:7px;height:7px;border-radius:50%;}
.dept-edit-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dept-edit-card.archived{opacity:.55;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;width:440px;max-width:92vw;box-shadow:var(--shadow);}
.modal-title{font-size:16px;font-weight:600;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.save-hint{font-size:11px;color:var(--green);margin-left:8px;opacity:0;transition:opacity .3s;}
.save-hint.show{opacity:1;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--text-3);}
.spinner{width:38px;height:38px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-banner{background:var(--red-bg);border:1px solid var(--red);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:13px;color:var(--red);}
.toggle-wrap{display:flex;align-items:center;gap:12px;}
.toggle{width:42px;height:24px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--accent);border-color:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.toggle.on .knob{left:21px;}
/* archive section */
.arch-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);cursor:pointer;padding:10px 0 2px;user-select:none;}
.arch-toggle:hover{color:var(--text-2);}
.arch-toggle .arr{transition:transform .2s;display:inline-block;}
.arch-toggle.open .arr{transform:rotate(90deg);}
.arch-block{display:none;margin-top:12px;}
.arch-block.open{display:block;}
/* snapshot badge */
.snap-badge{font-size:9px;padding:2px 7px;border-radius:8px;background:var(--surface-3);color:var(--text-3);font-weight:500;letter-spacing:.03em;white-space:nowrap;}
/* funnel stub */
.funnel-stub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:12px;color:var(--text-3);}
.funnel-stub-icon{font-size:36px;opacity:.4;}
.funnel-stub-title{font-size:14px;font-weight:600;color:var(--text-2);}
.funnel-stub-text{font-size:12px;text-align:center;line-height:1.7;max-width:320px;}
/* fired row */
.fired-row{opacity:.5;}
.fired-row td{font-style:italic;}
/* locked funnel (dept view) */
.fn-lock-wrap{position:relative;}
.fn-lock-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;filter:blur(.6px);opacity:.5;}
.tag-chip-lock{font-size:11px;padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-3);}
.fn-lock-bars{display:flex;flex-direction:column;gap:12px;filter:blur(1.5px);opacity:.4;pointer-events:none;}
.fn-lock-row{display:grid;grid-template-columns:160px 1fr 40px;gap:14px;align-items:center;}
.fn-lock-label{font-size:12px;color:var(--text-2);}
.fn-lock-bar{height:26px;background:var(--surface-3);border-radius:7px;overflow:hidden;}
.fn-lock-fill{height:100%;background:var(--accent);border-radius:7px;}
.fn-lock-val{font-size:12px;color:var(--text-3);text-align:right;}
.fn-lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,14,20,.35);border-radius:12px;}
[data-theme="light"] .fn-lock-overlay{background:rgba(244,246,250,.55);}
.fn-lock-icon{font-size:30px;opacity:.7;}
.fn-lock-title{font-size:14px;font-weight:600;color:var(--text);}
.fn-lock-text{font-size:12px;color:var(--text-2);text-align:center;line-height:1.7;max-width:380px;}
.fn-lock-text code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11px;}
</style>
</head>

function fmtNum(n){
  n=r(n);var s=String(Math.abs(n)),res='';
  for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)res+='\u00A0';res+=s[i];}
  return(n<0?'-':'')+res;
}
function fmt(n){return fmtNum(n)+'\u00A0руб.';}
function fmtMin(n){return fmtNum(r(n))+'\u00A0мин';}
function pct(f,p){return p>0?r(f/p*100):0;}
function grad(p){p=Math.max(0,Math.min(100,p))/100;var s=[[251,110,91],[245,181,68],[46,211,167]];var g=p<.5?0:1,t=p<.5?p/.5:(p-.5)/.5,a=s[g],b=s[g+1];return'rgb('+r(a[0]+(b[0]-a[0])*t)+','+r(a[1]+(b[1]-a[1])*t)+','+r(a[2]+(b[2]-a[2])*t)+')';}
function daysTo(ds){if(!ds)return null;return Math.max(0,r((new Date(ds)-TODAY)/86400e3));}
function fmtD(ds){if(!ds)return'—';var p=ds.substring(0,10).split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function rr(fact,plan){var f=S.rangeFrom,t=S.rangeTo,el=Math.max(1,r((Math.min(TODAY,t)-f)/864e5)+1),tot=Math.max(1,r((t-f)/864e5)+1);var ex=plan*(el/tot);return ex>0?r(fact/ex*100):0;}
function calLabel(){var f=S.rangeFrom,t=S.rangeTo;return MN[f.getMonth()]+' '+String(f.getDate()).padStart(2,'0')+', '+f.getFullYear()+' — '+MN[t.getMonth()]+' '+String(t.getDate()).padStart(2,'0')+', '+t.getFullYear();}
function daysBadge(dn){if(dn===null)return'<span class="days-badge db-neu">—</span>';if(dn<=3)return'<span class="days-badge db-red">'+dn+'д</span>';if(dn<=7)return'<span class="days-badge db-amb">'+dn+'д</span>';if(dn<=14)return'<span class="days-badge db-neu">'+dn+'д</span>';return'<span class="days-badge db-grn">'+dn+'д</span>';}
function si(a,d){return a?'<span class="sort">'+(d>0?'▲':'▼')+'</span>':'<span class="sort">↕</span>';}
// v3: платящих за период = орги с минутами > 0. null = ещё грузится → fallback на снимок
function payingInPeriod(clients){if(!S.periodReady)return null;return clients.filter(function(c){return(S.periodStats[c.platform_org_id]||0)>0;}).length;}
function todayISO(){return TODAY.toISOString().substring(0,10);}
function dateISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ═══ DATA LOADING ═══ */
function loadData(){
  S.loading=true;S.loadErr=null;render();
  return Promise.all([
    sbGet('departments?select=*&order=created_at'),
    sbGet('employees?select=*&order=name'),
    // Убрали is_archived=eq.false — теперь показываем всех с ответственным.
    // Истёкшие подписки (isArchived=true на платформе) — это не архивные клиенты, просто без активной подписки.
    // Реально архивированные орги (скрытые через «В архив» в платформе) исключаем через platform_status или руками через is_hidden.
    sbGet('clients?select=platform_org_id,company_name,platform_url,responsible_platform_user_id,minutes_total,minutes_left,monthly_plan,monthly_fact,subscription_status,subscription_name,subscription_end,is_hidden,is_archived&responsible_platform_user_id=not.is.null&order=company_name&limit=3000'),
    sbGet('clients?select=platform_org_id,company_name,responsible_platform_user_id,is_archived,is_hidden&responsible_platform_user_id=not.is.null&order=company_name&limit=5000')
  ]).then(function(res){
    RAW.depts=res[0];RAW.employees=res[1];RAW.clients=res[2];RAW.allClients=res[3]||[];
    if(!RAW.depts.length&&!RAW.employees.length)
      S.loadErr='Supabase вернул пустые данные. Запусти migration_v2.sql и нажми ↻ Обновить.';
    buildDB();S.loading=false;
    if(!S.ropDept&&DB.depts.length)S.ropDept=DB.depts[0].id;
    if(!S.mgrAs){DB.depts.forEach(function(d){if(!S.mgrAs&&d.staff.length)S.mgrAs=d.staff[0].id;});}
    render();
    refreshPeriod();
  }).catch(function(e){S.loading=false;S.loadErr=e.message;render();});
}

// v4: единый перерасчёт за период — минуты + сделки + планы
function refreshPeriod(){
  S.periodReady=false;
  return Promise.all([loadPeriodStatsRaw(),loadDeals(),loadPlans()]).then(function(){
    buildDB();S.periodReady=true;render();
  }).catch(function(e){console.error(e);S.periodReady=true;render();});
}

function buildDB(){
  var activeDepts=RAW.depts.filter(function(d){return!d.is_archived;});
  var firedEmps=RAW.employees.filter(function(e){return e.fired_at||e.is_archived;});
  var activeEmps=RAW.employees.filter(function(e){return!e.fired_at&&!e.is_archived;});

  var eBP={},eBD={},cBU={};
  activeEmps.forEach(function(e){if(e.platform_user_id)eBP[e.platform_user_id]=e;});
  activeEmps.forEach(function(e){if(e.dept_id)(eBD[e.dept_id]=eBD[e.dept_id]||[]).push(e);});
  var visibleClients=RAW.clients.filter(function(c){return!c.is_hidden;});
  visibleClients.forEach(function(c){var u=c.responsible_platform_user_id;if(u)(cBU[u]=cBU[u]||[]).push(c);});

  var depts=activeDepts.map(function(d){
    var emps=eBD[d.id]||[];
    var lead=RAW.employees.find(function(e){return e.id===d.lead_employee_id;});
    var staff=emps.map(function(e){
      var ec=cBU[e.platform_user_id]||[];
      var dealAgg=S.dealsByEmp[e.id]||{fact:0,comm:0,count:0};
      var planAmt=ec.reduce(function(a,c){return a+(S.planByOrg[c.platform_org_id]||0);},0);
      return{id:e.platform_user_id,supaId:e.id,name:e.name,
        role:e.role==='lead'?'Тимлид':'Менеджер',hired:e.hired_at||'2025-01-01',
        fact:dealAgg.fact,plan:planAmt,comm:dealAgg.comm,deals:dealAgg.count,
        clients:ec.length};
    });
    staff.sort(function(a,b){return(b.role==='Тимлид')-(a.role==='Тимлид');});
    var dc=emps.reduce(function(a,e){return a.concat(cBU[e.platform_user_id]||[]);},[]);
    var dFact=staff.reduce(function(a,m){return a+m.fact;},0);
    var dPlan=staff.reduce(function(a,m){return a+m.plan;},0);
    return{id:d.id,name:d.name,tl:lead?lead.name:'—',leadId:d.lead_employee_id,
      fact:dFact,plan:dPlan,
      paying:dc.filter(function(c){return c.subscription_status==='active';}).length,
      arpu:dc.length?r(dFact/dc.length):0,staff:staff,
      fired:firedEmps.filter(function(e){return e.dept_id===d.id;}),
      clients:dc.map(function(c){return{platform_org_id:c.platform_org_id,
        name:(c.company_name||'').substring(0,45),mgr:c.responsible_platform_user_id,
        url:c.platform_url||'#',
        plan:S.planByOrg[c.platform_org_id]||0,
        fact:(S.dealsByOrg[c.platform_org_id]||{fact:0}).fact,
        minSpent:Math.max(0,(c.minutes_total||0)-(c.minutes_left||0)),
        minLeft:c.minutes_left||0,expiry:c.subscription_end||null};})};
  });

  DB={
    company:{
      fact:depts.reduce(function(a,d){return a+d.fact;},0),
      plan:depts.reduce(function(a,d){return a+d.plan;},0),
      clients:depts.reduce(function(a,d){return a+d.clients.length;},0),
      paying:depts.reduce(function(a,d){return a+d.paying;},0)
    },
    depts:depts,
    archivedDepts:RAW.depts.filter(function(d){return d.is_archived;}),
    firedEmps:firedEmps,
    hiddenClients:RAW.clients.filter(function(c){return c.is_hidden;})
  };
}

/* ═══ PERIOD STATS (МИН ИСП.) ═══ */
function loadPeriodStatsRaw(){
  S.periodStats={};S.periodLoading=true;
  var from=S.rangeFrom,to=S.rangeTo;
  var curMonthStart=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  var months=[],cur=new Date(from.getFullYear(),from.getMonth(),1);
  while(cur<=to){months.push(new Date(cur.getTime()));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  var pastMonths=months.filter(function(m){return m<curMonthStart;});
  var hasCurrent=months.some(function(m){return m.getTime()===curMonthStart.getTime();});
  var promises=[];
  if(pastMonths.length){
    var dates=pastMonths.map(function(m){return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';});
    var q='client_stats?select=platform_org_id,used_minutes&period_type=eq.month&stat_date=in.('+dates.join(',')+')'+'&limit=50000';
    promises.push(sbGet(q).then(function(rows){rows.forEach(function(row){S.periodStats[row.platform_org_id]=(S.periodStats[row.platform_org_id]||0)+(row.used_minutes||0);});}));
  }
  if(hasCurrent){
    var mStart=curMonthStart.getFullYear()+'-'+String(curMonthStart.getMonth()+1).padStart(2,'0')+'-01';
    var q2='client_stats?select=platform_org_id,used_minutes&period_type=eq.day&stat_date=gte.'+mStart+'&stat_date=lte.'+todayISO()+'&limit=500000';
    promises.push(sbGet(q2).then(function(rows){rows.forEach(function(row){S.periodStats[row.platform_org_id]=(S.periodStats[row.platform_org_id]||0)+(row.used_minutes||0);});}));
  }
  return Promise.all(promises).then(function(){S.periodLoading=false;}).catch(function(){S.periodLoading=false;});
}

/* ═══ DEALS (факт за период) ═══ */
function loadDeals(){
  S.dealsRaw=[];S.dealsByEmp={};S.dealsByOrg={};
  var from=dateISO(S.rangeFrom),to=dateISO(S.rangeTo);
  return sbGet('deals?select=*&deal_date=gte.'+from+'&deal_date=lte.'+to+'&order=deal_date.desc&limit=100000').then(function(rows){
    S.dealsRaw=rows||[];
    S.dealsRaw.forEach(function(d){
      var sign=d.event_type==='refund'?-1:1;
      var amt=sign*(Number(d.amount)||0);
      var comm=amt*(Number(d.motivation_pct)||0)/100;
      if(d.employee_id){var e=S.dealsByEmp[d.employee_id]||(S.dealsByEmp[d.employee_id]={fact:0,comm:0,count:0});e.fact+=amt;e.comm+=comm;e.count++;}
      if(d.platform_org_id){var o=S.dealsByOrg[d.platform_org_id]||(S.dealsByOrg[d.platform_org_id]={fact:0});o.fact+=amt;}
    });
  });
}

/* ═══ PLANS (план по клиентам за период) ═══ */
function loadPlans(){
  S.planByOrg={};
  var months=[],cur=new Date(S.rangeFrom.getFullYear(),S.rangeFrom.getMonth(),1);
  while(cur<=S.rangeTo){months.push({y:cur.getFullYear(),m:cur.getMonth()+1});cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  if(!months.length)return Promise.resolve();
  var orParts=months.map(function(mm){return'and(year.eq.'+mm.y+',month.eq.'+mm.m+')';}).join(',');
  var q='client_monthly_records?select=platform_org_id,monthly_plan,year,month&or=('+orParts+')&limit=100000';
  return sbGet(q).then(function(rows){
    (rows||[]).forEach(function(t){S.planByOrg[t.platform_org_id]=(S.planByOrg[t.platform_org_id]||0)+(Number(t.monthly_plan)||0);});
  });
}

/* ═══ CALENDAR ═══ */
function buildMonth(base){var y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),sd=(first.getDay()+6)%7,days=[];for(var i=0;i<sd;i++)days.push({d:new Date(y,m,1-(sd-i)),other:true});var dim=new Date(y,m+1,0).getDate();for(var k=1;k<=dim;k++)days.push({d:new Date(y,m,k),other:false});while(days.length%7){var l=days[days.length-1].d;days.push({d:new Date(l.getFullYear(),l.getMonth(),l.getDate()+1),other:true});}return days;}
function renderCalMonth(base){var days=buildMonth(base);var cells=DOW.map(function(d){return'<div class="cal-dow">'+d+'</div>';}).join('');days.forEach(function(o){var isDisabled=o.d<MIN_DATE;var cls='cal-day'+(o.other?' other':'')+(isDisabled?' disabled':'');var t=o.d.getTime(),f=S.rangeFrom.getTime(),tt=S.rangeTo.getTime();if(!isDisabled){if(sameDay(o.d,S.rangeFrom)&&sameDay(o.d,S.rangeTo))cls+=' range-single';else if(sameDay(o.d,S.rangeFrom))cls+=' range-start';else if(sameDay(o.d,S.rangeTo))cls+=' range-end';else if(t>f&&t<tt)cls+=' in-range';}cells+='<div class="'+cls+'" '+(isDisabled?'':'onclick="pickDay('+o.d.getFullYear()+','+o.d.getMonth()+','+o.d.getDate()+')"')+'>'+o.d.getDate()+'</div>';});return'<div class="cal-grid">'+cells+'</div>';}
function renderCal(){var L=S.calLeft,R=new Date(L.getFullYear(),L.getMonth()+1,1);var ph=['7 дней','30 дней','Этот месяц','Квартал'].map(function(p,i){return'<button class="cal-preset" onclick="applyPreset('+i+')">'+p+'</button>';}).join('');return'<div class="cal-presets">'+ph+'</div><div class="cal-months"><div><div class="cal-mhead"><button class="cal-nav" onclick="calShift(-1)">‹</button><span class="cal-mtitle">'+MN[L.getMonth()]+' '+L.getFullYear()+'</span><span style="width:28px"></span></div>'+renderCalMonth(L)+'</div><div><div class="cal-mhead"><span style="width:28px"></span><span class="cal-mtitle">'+MN[R.getMonth()]+' '+R.getFullYear()+'</span><button class="cal-nav" onclick="calShift(1)">›</button></div>'+renderCalMonth(R)+'</div></div>';}
window.calShift=function(d){S.calLeft=new Date(S.calLeft.getFullYear(),S.calLeft.getMonth()+d,1);render();};
window.pickDay=function(y,m,d){var p=new Date(y,m,d);if(p<MIN_DATE)return;if(S.pick===0){S.rangeFrom=p;S.rangeTo=p;S.pick=1;}else{if(p<S.rangeFrom){S.rangeTo=S.rangeFrom;S.rangeFrom=p;}else S.rangeTo=p;S.pick=0;refreshPeriod();}render();};
window.applyPreset=function(i){var p=[{days:7},{days:30},{tm:1},{days:90}][i];if(p.tm){S.rangeFrom=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);S.rangeTo=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0);}else{S.rangeTo=new Date(TODAY);S.rangeFrom=new Date(Math.max(S.rangeTo.getTime()-(p.days-1)*864e5,MIN_DATE.getTime()));}S.calLeft=new Date(S.rangeFrom.getFullYear(),S.rangeFrom.getMonth(),1);S.pick=0;refreshPeriod();render();};

function renderDept(){

  var p2=pct(d.fact,d.plan),rrv=rr(d.fact,d.plan);
  var dPaying=payingInPeriod(d.clients);if(dPaying===null)dPaying=d.paying;
  var kpis=[{l:'Выручка',v:fmt(d.fact),s:'из '+fmt(d.plan)+' · '+p2+'%',bar:p2,bc:grad(p2)},{l:'Ранрейт',v:rrv+'%',s:'<span class="'+(rrv>=100?'pos':rrv>=80?'neu':'neg')+'">'+(rrv>=100?'опережаем':'отстаём')+'</span>',raw:true},{l:'ARPU',v:fmt(d.arpu),s:'средний на клиента'},{l:'Платящих за период',v:dPaying,s:'из '+d.clients.length+' в портфеле'},{l:'В команде',v:d.staff.length,s:'сотрудников'}];

  var ct='';
  if(S.tab==='staff'){
    var staff=[].concat(d.staff);staff.forEach(function(m){m._p=pct(m.fact,m.plan);m._r=rr(m.fact,m.plan);});

    var cols=[['name','Сотрудник',''],['fact','Факт','r'],['plan','План','r'],['pct','%','r'],['rr','Ранрейт','r'],['clients','Клиентов','r']];
    var th=cols.map(function(c){var a=S.staffSortKey===c[0];return'<th class="'+c[2]+(a?' sorted':'')+'" onclick="sortStaff(\''+c[0]+'\')">'+c[1]+si(a,S.staffSortDir)+'</th>';}).join('');
    var rows=staff.length?staff.map(function(m){var c3=grad(m._p);return'<tr><td><span class="strong">'+m.name+'</span></td><td class="r strong num">'+fmt(m.fact)+'</td><td class="r muted num">'+fmt(m.plan)+'</td><td class="r"><span style="color:'+c3+';font-weight:600" class="num">'+m._p+'%</span><div class="inbar"><div class="inbar-f" style="width:'+Math.min(m._p,100)+'%;background:'+c3+'"></div></div></td><td class="r"><span style="color:'+grad(m._r)+';font-weight:600" class="num">'+m._r+'%</span></td><td class="r muted num">'+m.clients+'</td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty-state">Нет сотрудников</div></td></tr>';
    ct='<div class="panel"><table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  if(S.tab==='clients'){

    var msCtrl='<div id="ms-c" class="ms-wrap">'+(function(){var chips=sel.map(function(id){return'<span class="ms-chip">'+(mgrNames[id]||id)+'<span class="x" onclick="removeMgr(event,\''+id+'\')">×</span></span>';}).join('');var ctrl='<div class="ms-control" onclick="toggleMgrDrop(event)"><button class="ms-add" onclick="toggleMgrDrop(event)">+</button>'+(sel.length?chips:'<span class="ms-hint">Все менеджеры</span>')+'</div>';var opts=d.staff.map(function(m){var on=sel.indexOf(m.id)>=0;return'<div class="ms-opt'+(on?' sel':'')+'" onclick="toggleMgr(event,\''+m.id+'\')"><span class="check">'+(on?'✓':'')+'</span>'+m.name+'</div>';}).join('');return ctrl+'<div class="ms-drop'+(S.mgrDropOpen?' open':'')+'"><div class="ms-sect">Менеджеры</div>'+opts+'</div>';})()+'</div>';

    list.sort(function(a,b){var k=S.cliSortKey,va=a[k],vb=b[k];if(k==='pct'){va=a._p;vb=b._p;}if(typeof va==='string')return S.cliSortDir*va.localeCompare(vb);return S.cliSortDir*((va||0)-(vb||0));});
    var cols=[['name','Компания',''],['plan','План','r'],['fact','Факт','r'],['pct','%','r'],['minLeft','Мин ост.','r'],['expiry','До прод.','r']];

    var body=list.length?list.map(function(c){var c3=grad(c._p);return'<tr><td><a class="ext-link" href="'+c.url+'" target="_blank">'+c.name+' <span class="lk">↗</span></a></td><td class="r muted num">'+fmt(c.plan)+'</td><td class="r strong num" style="color:'+c3+'">'+fmt(c.fact)+'</td><td class="r"><span style="color:'+c3+';font-size:11px;font-weight:600" class="num">'+c._p+'%</span></td><td class="r muted num">'+fmtMin(c.minLeft)+'</td><td class="r">'+daysBadge(c._d)+'</td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty-state">Нет клиентов</div></td></tr>';
    ct='<div class="panel">'+msCtrl+'<table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  if(S.tab==='funnel'){
    var fmgrs=[{id:'all',name:'Все менеджеры'}].concat(d.staff.map(function(m){return{id:m.id,name:m.name};}));
    var fmgrSel='<select style="padding:7px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setDeptFunnelMgr(this.value)">'+fmgrs.map(function(m){return'<option value="'+m.id+'"'+(m.id===S.deptFunnelMgr?' selected':'')+'>'+m.name+'</option>';}).join('')+'</select>';
    var stages=['Лиды в работе','Квалифицировано','Встречи назначено','Встречи проведено','Счета выставлено','Оплаты получено'];
    var tagChips=['холодка','Заявка с сайта','лидгенилья','Входящее обращение','beeline','Конференция'].map(function(t){return'<span class="tag-chip-lock">'+t+'</span>';}).join('');
    var fakeW=[100,62,44,33,22,13];
    var bars=stages.map(function(s,i){return'<div class="fn-lock-row"><span class="fn-lock-label">'+s+'</span><div class="fn-lock-bar"><div class="fn-lock-fill" style="width:'+fakeW[i]+'%"></div></div><span class="fn-lock-val">—</span></div>';}).join('');
    ct='<div class="panel"><div class="adm-head" style="margin-bottom:18px"><div class="panel-title" style="margin:0">Воронка первички</div>'+fmgrSel+'</div>'+
      '<div class="fn-lock-wrap">'+
        '<div class="fn-lock-tags">'+tagChips+'</div>'+
        '<div class="fn-lock-bars">'+bars+'</div>'+
        '<div class="fn-lock-overlay"><div class="fn-lock-icon">🔒</div><div class="fn-lock-title">Воронка подключается</div><div class="fn-lock-text">Данные тянутся из amoCRM. Запусти синк <code>amoCRM.gs</code> → таблица <code>amo_leads</code> → воронка с разбивкой по тегам и менеджерам оживёт здесь.</div></div>'+
      '</div></div>';
  }
  var archBtn='<button class="btn btn-sm btn-ghost" onclick="archiveDept(\''+d.id+'\')" title="Убрать отдел в архив" style="margin-left:8px">В архив</button>';
  var dealBtn='<button class="btn btn-sm btn-primary" onclick="addDeal(null,\''+d.id+'\')" style="margin-left:8px">+ Сделка</button>';
  setApp('<div class="topbar"><div class="nav-left"><button class="back-btn" onclick="goUp()">‹ Все отделы</button><span class="crumb-title">'+d.name+'</span>'+dealBtn+archBtn+'</div>'+calTrigger()+'</div><div class="dept-kpi">'+kH+'</div>'+tabs+ct);
}

function renderRop(){
  if(!DB.depts.length){
    setApp('<div class="topbar"><div class="nav-left"><span class="brand">Управление отделами</span></div></div><div class="empty-state">Нет отделов.</div><div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="createDept()">+ Создать отдел</button></div>');

    '</tr>';}).join(''):

  }
  // Без отдела
  var unassigned=RAW.employees.filter(function(e){return!e.dept_id&&!e.fired_at&&!e.is_archived;});
  var unaBlock=unassigned.length?'<div class="panel"><div class="panel-title">Без отдела ('+unassigned.length+')</div><table class="tbl"><thead><tr><th>Имя</th><th>Роль</th><th class="r">Действие</th></tr></thead><tbody>'+
    unassigned.map(function(e){return'<tr><td>'+e.name+'</td><td><span style="font-size:11px;color:var(--text-3)">'+(e.role==='lead'?'Тимлид':'Менеджер')+'</span></td><td class="r"><button class="btn btn-sm btn-primary" onclick="reassignEmp(\''+e.id+'\')">→ В отдел</button></td></tr>';}).join('')+
  '</tbody></table></div>':'';
  // Toggle
  var tog='<div class="panel" style="margin-bottom:14px"><div class="adm-head" style="margin:0"><div><div style="font-weight:600;font-size:13px">Источник факта выручки</div><div style="font-size:11px;color:var(--text-3);margin-top:3px">'+(S.factMode==='api'?'Тянется из API':'Менеджеры вбивают вручную')+'</div></div><div class="toggle'+(S.factMode==='api'?' on':'')+'" onclick="toggleFM()"><div class="knob"></div></div></div></div>';
  // Все отделы
  var deptCards=DB.depts.map(function(x){return'<div class="dept-edit-card"><div><div class="strong">'+x.name+'</div><div class="muted" style="font-size:11px;margin-top:2px">'+x.tl+' · '+x.staff.length+' чел. · план '+fmt(x.plan)+'</div></div><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="editDept(\''+x.id+'\')">Настроить</button><button class="btn btn-sm btn-ghost" onclick="archiveDept(\''+x.id+'\')" title="В архив">▾</button></div></div>';}).join('');
  // Архив отделов в РОП
  var archDeptBlock='';

    var isOpen2=S.ropShowArchivedDepts;

    archDeptBlock='<div class="arch-toggle'+(isOpen2?' open':'')+'" onclick="toggleRopArchDepts()"><span class="arr">›</span>Архив отделов ('+DB.archivedDepts.length+')</div><div class="arch-block'+(isOpen2?' open':'')+'">'+archList+'</div>';
  }
  setApp(
    '<div class="topbar"><div class="nav-left"><span class="brand">Управление отделами</span></div></div>'+
    tog+
    '<div class="panel" style="margin-bottom:0">'+
      '<div class="adm-head"><div style="display:flex;align-items:center;gap:12px"><div class="panel-title" style="margin:0">Состав отдела</div>'+
        '<select style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setRopDept(this.value)">'+deptOpts+'</select>'+

    '</div>'+
    unaBlock+

  );

function renderMgr(){
  var allMgrs=[];DB.depts.forEach(function(dd){dd.staff.forEach(function(m){allMgrs.push({id:m.id,name:m.name,dept:dd.name});});});

  if(!S.mgrAs||!allMgrs.find(function(m){return m.id===S.mgrAs;}))S.mgrAs=allMgrs[0].id;
  var d=DB.depts.find(function(x){return x.staff.some(function(m){return m.id===S.mgrAs;});});
  if(!d){S.mgrAs=allMgrs[0].id;d=DB.depts.find(function(x){return x.staff.some(function(m){return m.id===S.mgrAs;});});}

  var asSel='<select style="padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setMgrAs(this.value)">'+allMgrs.map(function(m){return'<option value="'+m.id+'"'+(m.id===S.mgrAs?' selected':'')+'>'+m.name+'</option>';}).join('')+'</select>';

  var totalPlan=me?me.plan:0;

  var planNote=singleMonth?'':'<span style="font-size:10px;color:var(--text-3);margin-left:6px">сумма за период</span>';
  var kH=[
    '<div class="kcard"><div class="kl">Мой план '+planNote+'</div><div class="kv num">'+fmt(totalPlan)+'</div><div class="ks"><span class="neu">факт '+fmt(totalFact)+' · '+mp+'%</span></div><div class="pbar"><div class="pfill" style="width:'+Math.min(mp,100)+'%;background:'+grad(mp)+'"></div></div></div>',
    '<div class="kcard"><div class="kl">Сделок за период</div><div class="kv num">'+myDeals+'</div><div class="ks"><span class="neu">'+myClients.length+' клиентов в портфеле</span></div></div>',
    '<div class="kcard"><div class="kl">Ранрейт</div><div class="kv num">'+rr(totalFact,totalPlan)+'%</div><div class="ks"><span class="neu">по моему плану</span></div></div>'
  ].join('');
  var tabs='<div class="tab-row">'+[['clients','Клиенты'],['funnel','Воронка']].map(function(t){return'<button class="tab'+(S.mgrTab===t[0]?' on':'')+'" onclick="setMgrTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
  var content='';
  if(S.mgrTab==='clients'){
    var periodLabel=MN[S.rangeFrom.getMonth()];
    if(S.rangeFrom.getMonth()!==S.rangeTo.getMonth())periodLabel=MN[S.rangeFrom.getMonth()]+' — '+MN[S.rangeTo.getMonth()];
    var py=S.rangeFrom.getFullYear(),pm=S.rangeFrom.getMonth()+1;
    var rows=myClients.map(function(c){
      var cp=pct(c.fact,c.plan);
      var minUsed=S.periodStats[c.platform_org_id];
      var minCell=S.periodLoading?'<span style="color:var(--text-3);font-size:11px">···</span>':(minUsed!=null?fmtMin(minUsed):'<span style="color:var(--text-3)">—</span>');
      var factColor=c.fact>0?grad(100):(c.fact<0?'var(--red)':'var(--text-3)');
      var planCell=singleMonth?
        '<td class="r"><input class="inline-input" type="number" value="'+c.plan+'" onchange="saveClientPlan(\''+c.platform_org_id+'\','+py+','+pm+',this.value)"></td>':
        '<td class="r muted num">'+fmt(c.plan)+'</td>';
      return'<tr>'+
        '<td><a class="ext-link" href="'+c.url+'" target="_blank">'+c.name+' <span class="lk">↗</span></a></td>'+
        planCell+
        '<td class="r strong num" style="color:'+factColor+'">'+fmt(c.fact)+'</td>'+
        '<td class="r"><span style="color:'+grad(cp)+';font-size:11px;font-weight:600" class="num">'+cp+'%</span></td>'+
        '<td class="r muted num">'+minCell+'</td>'+
        '<td class="r muted num">'+fmtMin(c.minLeft)+'</td>'+
        '<td class="r">'+daysBadge(daysTo(c.expiry))+'</td>'+
        '<td class="r"><button class="btn btn-sm btn-ghost" onclick="hideClient(\''+c.platform_org_id+'\',\''+c.name.replace(/'/g,'')+'\')" title="В архив">⋯</button></td>'+
      '</tr>';
    }).join('');
    var planHdr=singleMonth?'План ('+MN[pm-1]+')':'План';
    var table=myClients.length?
      '<table class="tbl"><thead><tr><th>Компания</th><th class="r">'+planHdr+'</th><th class="r">Факт за период</th><th class="r">%</th><th class="r">Мин исп. ('+periodLabel+')</th><th class="r">Мин ост.</th><th class="r">До прод.</th><th class="r"></th></tr></thead><tbody>'+rows+'</tbody></table>':
      '<div class="empty-state">Нет клиентов в портфеле.<br>Клиенты привязываются по ответственному в платформе.</div>';
    var myHiddenClients=DB.hiddenClients?DB.hiddenClients.filter(function(c){return c.responsible_platform_user_id===S.mgrAs;}):[];
    var archCliBlock='';
    if(myHiddenClients.length){
      var isOpen=S.showArchivedClients;
      var archRows=myHiddenClients.map(function(c){return'<tr><td class="muted">'+c.company_name+'</td><td class="r"><button class="btn btn-sm" onclick="unhideClient(\''+c.platform_org_id+'\')">Вернуть</button></td></tr>';}).join('');
      archCliBlock='<div class="arch-toggle'+(isOpen?' open':'')+'" onclick="toggleArchClients()"><span class="arr">›</span>Архив клиентов ('+myHiddenClients.length+')</div><div class="arch-block'+(isOpen?' open':'')+'"><table class="tbl" style="margin-top:8px"><tbody>'+archRows+'</tbody></table></div>';
    }
    var planHint=singleMonth?'Выставь план по каждому клиенту — сумма складывается в твой план за '+MN[pm-1]:'Выбран период из нескольких месяцев — план в режиме просмотра. Для редактирования выбери один месяц';
    content='<div class="panel"><div class="panel-title">'+planHint+'. Факт считается из сделок</div>'+table+archCliBlock+'</div>';
  }
  if(S.mgrTab==='funnel'){
    content='<div class="panel"><div class="funnel-stub"><div class="funnel-stub-icon">🔗</div><div class="funnel-stub-title">Воронка из amoCRM</div><div class="funnel-stub-text">Данные появятся после подключения amoCRM.<br>Готовый скрипт: <code>amoCRM.gs</code> → запиши в таблицу <code>amo_leads</code> → воронка оживёт автоматически.</div></div></div>';
  }
  var dealBtn=meSupaId?'<button class="btn btn-sm btn-primary" onclick="addDeal(\''+meSupaId+'\',null)" style="margin-left:8px">+ Сделка</button>':'';
  setApp('<div class="topbar"><div class="nav-left"><span class="brand">Кабинет менеджера</span>'+asSel+dealBtn+'<span class="save-hint'+(S.saveHint?' show':'')+'">✓ сохранено</span></div>'+calTrigger()+'</div><div class="dept-kpi" style="grid-template-columns:repeat(3,1fr)">'+kH+'</div>'+tabs+content);
}
window.setMgrAs=function(id){S.mgrAs=id;render();};
window.setMgrTab=function(t){S.mgrTab=t;render();};
window.toggleArchClients=function(){S.showArchivedClients=!S.showArchivedClients;render();};
window.saveClientPlan=function(orgId,y,m,v){
  fetch(SB_URL+'/rest/v1/client_monthly_records?on_conflict=platform_org_id,year,month',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({platform_org_id:orgId,year:y,month:m,monthly_plan:Number(v)||0})}).then(function(){refreshPeriod();flashSave();});
};
function flashSave(){S.saveHint=true;render();setTimeout(function(){S.saveHint=false;render();},1500);}

/* ═══ СДЕЛКИ (deal modal) ═══ */
window.addDeal=function(preEmpId,preDeptId){openDealModal(null,preEmpId,preDeptId);};
window.editDeal=function(dealId){var dl=S.dealsRaw.find(function(d){return d.id===dealId;});if(dl)openDealModal(dl,null,null);};
function openDealModal(existing,preEmpId,preDeptId){
  var emps=RAW.employees.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var empOpts=emps.map(function(e){var arch=(e.fired_at||e.is_archived)?' (архив)':'';return'<option value="'+e.id+'">'+e.name+arch+'</option>';}).join('');
  var initEmp=existing?existing.employee_id:(preEmpId||(emps[0]&&emps[0].id));
  var body=
    '<div class="field"><label>Событие *</label><select id="dl-type"><option value="payment">Оплата</option><option value="refund">Возврат</option></select></div>'+
    '<div class="field"><label>Сотрудник *</label><select id="dl-emp" onchange="dealEmpChanged()">'+empOpts+'</select></div>'+
    '<div class="field"><label>Клиент *</label><select id="dl-client"></select></div>'+
    '<div class="form-row" style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Сумма ₽ *</label><input id="dl-amount" type="number" placeholder="0"></div><div class="field" style="flex:1"><label>Мотивация % *</label><input id="dl-pct" type="number" placeholder="10" step="0.5"></div></div>'+
    '<div class="field"><label>Дата сделки *</label><input id="dl-date" type="date" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Комментарий (необязательно)</label><input id="dl-note" placeholder="—"></div>';
  openModal(existing?'Редактировать сделку':'Добавить сделку',body,function(){saveDeal(existing,preDeptId);});
  setTimeout(function(){
    var es=document.getElementById('dl-emp');if(es)es.value=initEmp;
    if(existing){
      document.getElementById('dl-type').value=existing.event_type||'payment';
      document.getElementById('dl-amount').value=existing.amount;
      document.getElementById('dl-pct').value=existing.motivation_pct;
      document.getElementById('dl-date').value=(existing.deal_date||'').substring(0,10);
      document.getElementById('dl-note').value=existing.note||'';
    }
    dealEmpChanged(existing?existing.platform_org_id:null);
    setupDealValidation();
  },0);
}
window.dealEmpChanged=function(preselectOrg){
  var empSel=document.getElementById('dl-emp');var clientSel=document.getElementById('dl-client');
  if(!empSel||!clientSel)return;
  var emp=RAW.employees.find(function(e){return e.id===empSel.value;});
  var puid=emp?emp.platform_user_id:null;
  var cls=(RAW.allClients||[]).filter(function(c){return c.responsible_platform_user_id===puid;});
  if(!cls.length){clientSel.innerHTML='<option value="">— нет клиентов —</option>';validateDeal();return;}
  clientSel.innerHTML=cls.map(function(c){var arch=(c.is_archived||c.is_hidden)?' (архив)':'';return'<option value="'+c.platform_org_id+'" data-name="'+(c.company_name||'').replace(/"/g,'')+'">'+(c.company_name||'')+arch+'</option>';}).join('');
  if(preselectOrg&&typeof preselectOrg==='string')clientSel.value=preselectOrg;
  validateDeal();
};
function setupDealValidation(){
  ['dl-type','dl-client','dl-amount','dl-pct','dl-date'].forEach(function(id){var el=document.getElementById(id);if(el){el.oninput=validateDeal;el.onchange=validateDeal;}});
  validateDeal();
}
function validateDeal(){
  var btn=document.getElementById('msave');if(!btn)return;
  function v(id){var el=document.getElementById(id);return el?el.value:'';}
  var amount=parseFloat(v('dl-amount'));
  var pctRaw=v('dl-pct');
  var ok = v('dl-type') && v('dl-emp') && v('dl-client') && amount>0 && pctRaw!=='' && !isNaN(parseFloat(pctRaw)) && v('dl-date');
  btn.disabled=!ok;
}
function saveDeal(existing,preDeptId){
  var type=document.getElementById('dl-type').value;
  var empId=document.getElementById('dl-emp').value;
  var clientSel=document.getElementById('dl-client');
  var orgId=clientSel.value||null;
  var clientName=clientSel.selectedOptions[0]?clientSel.selectedOptions[0].getAttribute('data-name'):'';
  var amount=Number(document.getElementById('dl-amount').value)||0;
  var pct2=Number(document.getElementById('dl-pct').value)||0;
  var date=document.getElementById('dl-date').value||todayISO();
  var note=document.getElementById('dl-note').value||null;
  if(amount<=0||!orgId){return;}
  var emp=RAW.employees.find(function(e){return e.id===empId;});
  var deptId=emp?emp.dept_id:(preDeptId||null);
  var dept=RAW.depts.find(function(x){return x.id===deptId;});
  var row={event_type:type,employee_id:empId,employee_name:emp?emp.name:'',
    platform_org_id:orgId,client_name:clientName,
    dept_id:deptId,dept_name:dept?dept.name:'',
    amount:amount,motivation_pct:pct2,deal_date:date,note:note};
  if(existing){
    sbPatch('deals','id=eq.'+existing.id,row).then(function(){closeModal();refreshPeriod();flashSave();});
  }else{
    sbPost('deals',row).then(function(){closeModal();refreshPeriod();flashSave();});
  }
}
window.deleteDeal=function(dealId){
  var dl=S.dealsRaw.find(function(d){return d.id===dealId;});
  openModal('Удалить сделку?','<p style="font-size:13px;color:var(--text-2);line-height:1.7">'+(dl?(dl.client_name||'—')+' · '+fmt(dl.amount):'')+'<br>Это действие нельзя отменить.</p>',
    function(){fetch(SB_URL+'/rest/v1/deals?id=eq.'+dealId,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'}}).then(function(){closeModal();refreshPeriod();});});
};

/* ═══ ЗАРПЛАТЫ (payroll) ═══ */
function renderPayroll(){
  // агрегируем S.dealsRaw по сотрудникам, с фильтрами
  var deptOpts='<option value="all">Все отделы</option>'+DB.depts.concat(DB.archivedDepts.map(function(d){return{id:d.id,name:d.name+' (архив)'};})).map(function(d){return'<option value="'+d.id+'"'+(S.payDept===d.id?' selected':'')+'>'+d.name+'</option>';}).join('');
  var allEmps=RAW.employees.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var empOpts='<option value="all">Все сотрудники</option>'+allEmps.map(function(e){var arch=(e.fired_at||e.is_archived)?' (архив)':'';return'<option value="'+e.id+'"'+(S.payEmp===e.id?' selected':'')+'>'+e.name+arch+'</option>';}).join('');

  var filtered=S.dealsRaw.filter(function(d){
    if(S.payDept!=='all'&&d.dept_id!==S.payDept)return false;
    if(S.payEmp!=='all'&&d.employee_id!==S.payEmp)return false;
    return true;
  });

  // агрегат по сотруднику
  var byEmp={};
  filtered.forEach(function(d){
    var sign=d.event_type==='refund'?-1:1;
    var amt=sign*(Number(d.amount)||0);
    var comm=amt*(Number(d.motivation_pct)||0)/100;
    var key=d.employee_id||'—';
    var e=byEmp[key]||(byEmp[key]={name:d.employee_name||'—',dept:d.dept_name||'—',fact:0,comm:0,count:0});
    e.fact+=amt;e.comm+=comm;e.count++;
  });
  var rowsArr=Object.keys(byEmp).map(function(k){return byEmp[k];}).sort(function(a,b){return b.comm-a.comm;});
  var totFact=rowsArr.reduce(function(a,e){return a+e.fact;},0);
  var totComm=rowsArr.reduce(function(a,e){return a+e.comm;},0);
  var totCount=rowsArr.reduce(function(a,e){return a+e.count;},0);

  var kH=[
    '<div class="ck"><div class="ck-l">Выручка за период</div><div class="ck-v num">'+fmt(totFact)+'</div><div class="ck-s">по выбранным фильтрам</div></div>',
    '<div class="ck"><div class="ck-l">Сделок</div><div class="ck-v num">'+totCount+'</div><div class="ck-s">оплат и возвратов</div></div>',
    '<div class="ck"><div class="ck-l">Начислено мотивации</div><div class="ck-v num">'+fmt(totComm)+'</div><div class="ck-s">сумма по сотрудникам</div></div>',
    '<div class="ck"><div class="ck-l">Сотрудников</div><div class="ck-v num">'+rowsArr.length+'</div><div class="ck-s">со сделками</div></div>'
  ].join('');

  var body=rowsArr.length?rowsArr.map(function(e){var avgPct=e.fact!==0?r(e.comm/e.fact*100):0;return'<tr><td><span class="strong">'+e.name+'</span></td><td class="muted">'+e.dept+'</td><td class="r muted num">'+e.count+'</td><td class="r strong num">'+fmt(e.fact)+'</td><td class="r muted num">'+avgPct+'%</td><td class="r strong num" style="color:var(--green)">'+fmt(e.comm)+'</td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty-state">Нет сделок</div></td></tr>';

  // построчная таблица сделок (для редактирования/удаления)
  var dealRows=filtered.slice().sort(function(a,b){return(b.deal_date||'').localeCompare(a.deal_date||'');}).map(function(d){
    var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);var comm=amt*(Number(d.motivation_pct)||0)/100;
    return'<tr>'+
      '<td class="muted num">'+fmtD(d.deal_date)+'</td>'+
      '<td><span class="strong">'+(d.employee_name||'—')+'</span></td>'+
      '<td class="muted">'+(d.dept_name||'—')+'</td>'+
      '<td>'+(d.client_name||'—')+(d.event_type==='refund'?' <span style="color:var(--red);font-size:10px">возврат</span>':'')+'</td>'+
      '<td class="r strong num"'+(amt<0?' style="color:var(--red)"':'')+'>'+fmt(amt)+'</td>'+
      '<td class="r muted num">'+(d.motivation_pct||0)+'%</td>'+
      '<td class="r strong num" style="color:var(--green)">'+fmt(comm)+'</td>'+
      '<td class="muted" style="font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(d.note||'')+'</td>'+
      '<td class="r" style="white-space:nowrap"><button class="btn btn-sm btn-ghost" onclick="editDeal(\''+d.id+'\')" title="Редактировать">✎</button> <button class="btn btn-sm btn-danger" onclick="deleteDeal(\''+d.id+'\')" title="Удалить">✕</button></td>'+
    '</tr>';
  }).join('');
  var dealTable=filtered.length?
    '<table class="tbl"><thead><tr><th>Дата</th><th>Сотрудник</th><th>Отдел</th><th>Компания</th><th class="r">Сумма</th><th class="r">%</th><th class="r">Начислено</th><th>Комментарий</th><th class="r"></th></tr></thead><tbody>'+dealRows+'</tbody></table>':
    '<div class="empty-state">Нет сделок за выбранный период и фильтры.<br>Добавь сделку через Коммдир → отдел → «+ Сделка» или в кабинете менеджера.</div>';

  var filters='<div class="adm-head"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
    '<select style="padding:7px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setPayDept(this.value)">'+deptOpts+'</select>'+
    '<select style="padding:7px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px" onchange="setPayEmp(this.value)">'+empOpts+'</select>'+
    '</div><button class="btn btn-primary" onclick="exportPayroll()">↓ Выгрузить xlsx</button></div>';

  // свод по сотрудникам (компактный, под детальной таблицей)
  var summaryRows=rowsArr.length?rowsArr.map(function(e){var avgPct=e.fact!==0?r(e.comm/e.fact*100):0;return'<tr><td><span class="strong">'+e.name+'</span></td><td class="muted">'+e.dept+'</td><td class="r muted num">'+e.count+'</td><td class="r strong num">'+fmt(e.fact)+'</td><td class="r muted num">'+avgPct+'%</td><td class="r strong num" style="color:var(--green)">'+fmt(e.comm)+'</td></tr>';}).join(''):'';
  var summaryBlock=rowsArr.length?'<div class="panel"><div class="panel-title">Свод по сотрудникам</div><table class="tbl"><thead><tr><th>Сотрудник</th><th>Отдел</th><th class="r">Сделок</th><th class="r">Выручка</th><th class="r">Ср. %</th><th class="r">Начислено</th></tr></thead><tbody>'+summaryRows+'</tbody></table></div>':'';

  setApp('<div class="topbar"><div class="nav-left"><span class="brand">Зарплатные листы</span></div>'+calTrigger()+'</div>'+
    '<div class="ckpi">'+kH+'</div>'+
    '<div class="panel">'+filters+dealTable+'</div>'+
    summaryBlock);
}
window.setPayDept=function(v){S.payDept=v;render();};
window.setPayEmp=function(v){S.payEmp=v;render();};
window.exportPayroll=function(){
  var filtered=S.dealsRaw.filter(function(d){
    if(S.payDept!=='all'&&d.dept_id!==S.payDept)return false;
    if(S.payEmp!=='all'&&d.employee_id!==S.payEmp)return false;
    return true;
  });
  if(!filtered.length){alert('Нет сделок для выгрузки');return;}
  // Лист 1: детально по сделкам
  var deals=filtered.map(function(d){var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);return{
    'Дата':d.deal_date,'Событие':d.event_type==='refund'?'Возврат':'Оплата','Сотрудник':d.employee_name,
    'Отдел':d.dept_name,'Клиент':d.client_name,'Сумма':amt,'Мотивация %':d.motivation_pct,
    'Начислено':amt*(Number(d.motivation_pct)||0)/100,'Комментарий':d.note||''};});
  // Лист 2: свод по сотрудникам
  var byEmp={};
  filtered.forEach(function(d){var sign=d.event_type==='refund'?-1:1;var amt=sign*(Number(d.amount)||0);var key=d.employee_id||'—';var e=byEmp[key]||(byEmp[key]={'Сотрудник':d.employee_name,'Отдел':d.dept_name,'Сделок':0,'Выручка':0,'Начислено':0});e['Сделок']++;e['Выручка']+=amt;e['Начислено']+=amt*(Number(d.motivation_pct)||0)/100;});
  var summary=Object.keys(byEmp).map(function(k){return byEmp[k];}).sort(function(a,b){return b['Начислено']-a['Начислено'];});
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Свод');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(deals),'Сделки');
  var fname='Зарплаты_'+dateISO(S.rangeFrom)+'_'+dateISO(S.rangeTo)+'.xlsx';
  XLSX.writeFile(wb,fname);
};

/* ═══ MODAL ═══ */
function openModal(title,body,onSave){
  var m=document.getElementById('modal');
  m.innerHTML='<div class="modal"><div class="modal-title">'+title+'</div>'+body+'<div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="msave">Сохранить</button></div></div>';
  m.classList.add('open');document.getElementById('msave').onclick=onSave;
}
window.closeModal=function(){var m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';};

/* ═══ RENDER ═══ */
function setApp(html){document.getElementById('app').innerHTML=roleBar()+html;}
function render(){
  if(S.loading){document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><div>Загружаю из Supabase…</div></div>';return;}
  if(S.role==='rop'){renderRop();return;}
  if(S.role==='mgr'){renderMgr();return;}
  if(S.role==='pay'){renderPayroll();return;}
  if(S.dept)renderDept();else renderCo();
}
loadData();
</script>
